# Nine deployment. Postgres always comes up; the daemon runs in one of two
# profiles:
#
#   production  — the built runtime image (immutable, no toolchain):
#                 docker compose --profile prod up -d
#
#   hot-reload  — the Go toolchain over a bind-mounted source tree; the daemon
#                 rebuilds and restarts on any .go change:
#                 docker compose --profile dev up
#
# Attach a session to either:  docker exec -it <nine|nine-dev> nine
# Stop everything (keep data): docker compose --profile prod --profile dev down
# Remove everything + data:    docker compose --profile prod --profile dev down -v

# Shared config for both daemon services. They reach the compose-internal
# Postgres by service name, and the host's LLM endpoint via host.docker.internal.
x-nine-common: &nine-common
  depends_on:
    postgres:
      condition: service_healthy
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &nine-env
    NINE_CONFIG: /nine.toml
    # The mounted nine.toml is written for the native layout; these override the
    # paths and endpoints that differ inside the container, so one config file
    # serves both (see internal/config.ApplyEnvOverrides).
    # Inside the compose network the database is reachable as `postgres:5432`.
    NINE_DATABASE_URL: postgres://nine:nine@postgres:5432/nine?sslmode=disable
    NINE_PLUGINS_BIN: /opt/nine/bin
    NINE_WORKSPACE_ROOT: /data/workspace
    # Your own skills and roles, bind-mounted read-only from ./skills.d below.
    # Seeded on every boot; an absent directory just means none (docs/skills.md).
    NINE_SKILLS_USER_DIR: /skills.d
    # Send logs to stderr so `docker compose logs` shows them.
    NINE_LOG_FILE: "off"
    # Optional LLM overrides (empty = use nine.toml). Passed through by the
    # Makefile's compose targets (make compose-prod / compose-dev).
    NINE_LLM_PROVIDER: "${NINE_LLM_PROVIDER:-}"
    NINE_LLM_MODEL: "${NINE_LLM_MODEL:-}"
    NINE_LLM_ENDPOINT: "${NINE_LLM_ENDPOINT:-http://host.docker.internal:11434}"
  healthcheck:
    test: ["CMD-SHELL", "test -S /tmp/nine.sock"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 30s
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nine-postgres
    environment:
      POSTGRES_USER: nine
      POSTGRES_PASSWORD: nine
      POSTGRES_DB: nine
    ports:
      - "5433:5432"
    volumes:
      - nine-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nine -d nine"]
      interval: 2s
      timeout: 3s
      retries: 30
  pgadmin:
    profiles: ["dev"]
    image: dpage/pgadmin4:latest
    container_name: nine-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: nine@nine.dev
      PGADMIN_DEFAULT_PASSWORD: nine
      # Desktop mode: no login page, no master password prompt. Dev-only.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - nine-pgadmin:/var/lib/pgadmin
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    restart: unless-stopped

  # ── Production: the built runtime image (no Go toolchain, no source). ────────
  nine:
    <<: *nine-common
    profiles: ["prod"]
    container_name: nine
    build:
      context: .
      target: runtime
    image: nine
    volumes:
      - nine-data:/data
      - ./nine.toml:/nine.toml:ro
      - ./skills.d:/skills.d:ro

  # ── Hot-reload: Go toolchain over the bind-mounted source; rebuild on change. ─
  nine-dev:
    <<: *nine-common
    profiles: ["dev"]
    container_name: nine-dev
    build:
      context: .
      target: dev
    image: nine-dev
    # Longer boot: the first build compiles the whole tree from cold.
    healthcheck:
      test: ["CMD-SHELL", "test -S /tmp/nine.sock"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 120s
    volumes:
      - .:/nine-src
      - nine-dev-data:/data
      - ./nine.toml:/nine.toml:ro
      - ./skills.d:/skills.d:ro
      - nine-dev-gocache:/root/.cache/go-build

volumes:
  nine-pgdata:
  nine-data:
  nine-dev-data:
  nine-dev-gocache:
  nine-pgadmin: