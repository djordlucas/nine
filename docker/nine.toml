# Default configuration baked into the published image at /nine.toml.
#
# It exists so `docker run ghcr.io/djordlucas/nine` works without cloning the
# repository. It is deliberately more conservative than the repo's own nine.toml,
# which is a development config: no developer tool directory is loaded, self
# reflection runs at a quarter of the rate, and every path points at the /data
# volume rather than the source tree. Both tool tiers are on, as they are by
# default — what keeps this narrow is the capability ceiling, not the switches.
#
# To change anything here, mount your own file over it:
#
#   docker run -v ./my-nine.toml:/nine.toml:ro ghcr.io/djordlucas/nine
#
# The LLM settings also take environment overrides without a mounted file —
# NINE_LLM_PROVIDER, NINE_LLM_MODEL, NINE_LLM_ENDPOINT. Full reference:
# docs/configuration.md.

[llm]
provider = "ollama"
model    = "qwen3.5:4b"
# host.docker.internal resolves on Docker Desktop. On plain Linux, either run
# with --add-host host.docker.internal:host-gateway (what the README shows) or
# set NINE_LLM_ENDPOINT to the host's address.
endpoint       = "http://host.docker.internal:11434"
num_ctx        = 32768
max_concurrent = 1

[daemon]
# How often the idle self-reflection session wakes and thinks. It maintains
# Nine's self-model, so it ships on — but every tick is an LLM call, and a
# published image runs unattended against whatever endpoint it is pointed at.
# At the 2m default an idle container bills a metered API around the clock and
# monopolises a single-slot local model; 30m keeps the behaviour without that.
# "off" removes it entirely.
self_reflection = "30m"

[memory]
# The /data volume holds every durable thing: this database and the workspace.
path = "/data/nine.db"

[workspace]
# The filesystem root the workspace file tools are scoped to, mounted at /work
# inside the sandbox. Keeping it inside /data
# means a `docker run -v nine-data:/data` keeps the agent's files across
# restarts, and nothing it writes escapes the volume.
root = "/data/workspace"

[embeddings]
# The built-in feature-hashing embedder: no model, no network, no VRAM. Tool
# and skill ranking work out of the box with it. Set provider = "ollama" and a
# model to rank semantically instead.
provider = "keyword"

[hitl]
# Tools that need an explicit yes before each call, in an interactive session.
# A background session has nobody to ask, so these gate the TUI and CLI only.
require_approval = ["shell", "write_file"]

[tools]
# The sandboxed-tool tier is on: it carries read_file, write_file, edit_file and
# the rest of the workspace filesystem, so without it the agent cannot read or
# write a file at all. Nothing is mounted to get them — qjs.wasm, the harness
# bytecode and all 14 shipped tools are embedded in the binary, and `user_dir`
# stays unset, so no tool outside that set is loaded.
#
# These run in a wasm sandbox with declared filesystem capabilities, scoped to
# the workspace. The `shell` plugin, which is also on, executes arbitrary
# commands — so this is the narrower of the two capabilities the image ships,
# not a widening of what the agent can reach (docs/sandboxed-tools.md).
#
# Stated rather than omitted: `enabled` defaults to true, and this line is here so
# a reader of the published config does not have to know that.
enabled = true

[tools.agent]
# The generated tier is on: Nine can write its own tools. Its ceiling is the
# workspace, read and write, derived from [workspace].root — the same directory
# the shipped file tools reach and `shell` already runs in. A generated tool is
# therefore strictly narrower than the `shell` this image also ships: wasm, one
# instance per call, no network, no environment, and nothing outside /work.
#
# A tool that declares no capability is granted none, whatever the ceiling says,
# and `require_approval` defaults to "on_capability" — so a tool that asks for
# filesystem reach prompts a human in an interactive session, while a pure
# transform does not.
enabled = true

# Everything with wider reach stays off, and is named here so the posture is
# legible rather than inferred from absence:
#
#   [tools.agent.deps] mode    external npm packages (default "off")
#   allow_network_deps         a networked dependency plus net.http (default false)
#   allow_long_running         a tool whose work outlives one call (default false)
#   allow_standing             a tool that runs on its own cadence (default false)
#   [tools.agent.capabilities.net.http]  outbound HTTP (no default grant)
#
# `web_search`, `web_page_read` and `http_get` are shipped tools, so the agent can
# reach the web without any generated tool being granted net.http.
