name: Security Scan

on:
  push:
    branches: [main, security-hardening]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"  # Weekly on Monday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Code scanning is unavailable while the repository is private: GitHub code
# scanning (CodeQL analysis and SARIF upload to the Security tab) requires a
# public repository or a GitHub Advanced Security license, and fails with
# "Code scanning is not enabled for this repository" on private repos.
#
# Consequently the CodeQL job is removed and the Trivy upload-sarif steps are
# continue-on-error. The Trivy scans themselves run as a failing gate
# (exit-code: 1) again now that the base-image/dependency findings they surface
# have been remediated (PR #155). Re-enable CodeQL and the SARIF uploads once
# the repository is public. Tracked in the README roadmap.

jobs:
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scanner (diagnostic table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library
          format: table

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          format: sarif
          output: trivy-fs-results.sarif

      - name: Upload to Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
        if: always()
        continue-on-error: true  # SARIF upload needs a public repo or GHAS

  trivy-docker:
    name: Trivy Docker Image Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: nine:scan
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy container scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: nine:scan
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          format: sarif
          output: trivy-docker-results.sarif

      - name: Upload to Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-docker-results.sarif
        if: always()
        continue-on-error: true  # SARIF upload needs a public repo or GHAS
