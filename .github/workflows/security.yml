name: Security Scan

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"  # Weekly on Monday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

# Code scanning is available: it needs a public repository or GitHub Advanced
# Security, and this repository is public. So CodeQL analyses every push and
# pull request, and the Trivy SARIF uploads are a hard failure rather than
# continue-on-error — an upload that silently stops working leaves the Security
# tab looking clean because nothing arrived, which is the failure mode worth
# being loud about.
#
# The Trivy scans themselves are a gate on their own exit code (exit-code: 1),
# independent of whether their findings reach the Security tab.

# A pull request from a fork gets no scan. This repository accepts none
# (CONTRIBUTING.md), and a scan of a fork's branch is not a read-only act: the
# image job builds a Dockerfile that pull request may have rewritten, on the
# runner.
#
# GitHub's own control for this — Actions > Fork pull request workflows > require
# approval for all outside contributors — is now set as well. The condition below
# is kept because it does not depend on that setting surviving a visibility
# change or a settings edit.
jobs:
  codeql:
    name: CodeQL
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # CodeQL reads the workflow run to attribute results
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Pinned to the same SHA as the upload-sarif steps below, since all three
      # are the same action repository. Dependabot moves them together.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          languages: go
          build-mode: manual

      # Manual build mode, not autobuild: the tree is two Go modules and the
      # build is vendored, so `make build` is the only command that gets this
      # right. Autobuild would guess, and a wrong guess analyses nothing while
      # still reporting success.
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        run: make build

      - name: Analyze
        uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          category: codeql-go

  trivy-fs:
    name: Trivy Filesystem Scan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-fs-results.sarif

      - name: Upload to Security Tab
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: trivy-fs-results.sarif
        if: always()

  trivy-docker:
    name: Trivy Docker Image Scan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          tags: nine:scan
          load: true
          push: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy container scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: nine:scan
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-docker-results.sarif

      - name: Upload to Security Tab
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: trivy-docker-results.sarif
        if: always()
