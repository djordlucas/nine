name: Security Scan

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"  # Weekly on Monday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

# Code scanning is unavailable while the repository is private: GitHub code
# scanning (CodeQL analysis and SARIF upload to the Security tab) requires a
# public repository or a GitHub Advanced Security license, and fails with
# "Code scanning is not enabled for this repository" on private repos.
#
# Consequently the CodeQL job is removed and the Trivy upload-sarif steps are
# continue-on-error. The Trivy scans themselves run as a failing gate
# (exit-code: 1) again now that the base-image/dependency findings they surface
# have been remediated (PR #155). Re-enable CodeQL and the SARIF uploads once
# the repository is public. Tracked in the README roadmap.

# A pull request from a fork gets no scan. This repository accepts none
# (CONTRIBUTING.md), and a scan of a fork's branch is not a read-only act: the
# image job builds a Dockerfile that pull request may have rewritten, on the
# runner.
#
# GitHub's own control for this — Actions > Fork pull request workflows >
# require approval for all outside contributors — cannot be set while the
# repository is private (the API refuses it with 422), and its default only
# gates contributors it has not seen before. The condition below holds either
# way, so it stays after that setting is turned on.
jobs:
  trivy-fs:
    name: Trivy Filesystem Scan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-fs-results.sarif

      - name: Upload to Security Tab
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: trivy-fs-results.sarif
        if: always()
        continue-on-error: true  # SARIF upload needs a public repo or GHAS

  trivy-docker:
    name: Trivy Docker Image Scan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          tags: nine:scan
          load: true
          push: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy container scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: nine:scan
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-docker-results.sarif

      - name: Upload to Security Tab
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: trivy-docker-results.sarif
        if: always()
        continue-on-error: true  # SARIF upload needs a public repo or GHAS
