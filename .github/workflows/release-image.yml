# Publishes the runtime image to GHCR, and to Docker Hub if its secrets are set.
#
# A package first published to a personal namespace is private by default, so
# releasing from a private repository needs no visibility step here; the steps
# that do care are marked below.
#
# Order matters and is the point of this file: build once, scan what was built,
# and only then push. A scan that runs after the push has already shipped the
# thing it was meant to gate.
#
# The image is built once per architecture into the local daemon for scanning
# and testing, then rebuilt from cache as a multi-arch manifest for the push.
# The rebuild is a cache hit, not a second compile.
#
# Actions are pinned by commit SHA. A tag is mutable, so `@v5` is a promise that
# whoever controls the tag will not change it; a SHA is not a promise. Dependabot
# bumps these (.github/dependabot.yml) and keeps the version comment in step.
name: Release image

on:
  push:
    tags: ["v*"]
  # A dry run builds, scans and tests without pushing. Use it to check a change
  # to this workflow, or the Dockerfile, without cutting a release.
  workflow_dispatch:
    inputs:
      push:
        description: "Push to the registries (leave false for a dry run)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/${{ github.repository_owner }}/nine

permissions:
  contents: read

jobs:
  # Resolved once, in its own job: a matrix job's outputs come from whichever
  # leg finished last, which is not a defined choice.
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_date: ${{ steps.version.outputs.build_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # `nine version` and the image's version label come from the tag, so
          # the tag has to be present to describe.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Building version ${version}"

  # ── Gate: build each published arch, scan it, run the image contract tests ──
  # Nothing is pushed from this job. If it fails, publish never runs.
  verify:
    name: Build, scan and test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: true
      matrix:
        # Both published architectures are scanned. The Debian layers differ per
        # arch, so scanning only amd64 would ship arm64 ungated.
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          tags: nine:verify
          load: true
          push: false
          provenance: false
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ needs.meta.outputs.build_date }}
          cache-from: type=gha,scope=release-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.platform }}

      # The gate. CRITICAL/HIGH with a known fix fails the job, which stops the
      # publish job from running at all.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: nine:verify
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          format: table

      - name: Scan image (SARIF for the Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          scan-type: image
          image-ref: nine:verify
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-image.sarif

      - name: Upload to Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3
        if: always()
        continue-on-error: true # needs a public repo or GHAS
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.platform }}

      - name: Setup Go
        if: matrix.platform == 'linux/amd64'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum

      # Asserts the image contract: runs as uid 1000, no toolchain or secrets in
      # the layers, /data writable, the daemon answers, the version label matches.
      - name: Image contract tests
        # Native arch only: running the containers under QEMU would add
        # emulation flakiness to a release gate. Both arches are still scanned.
        if: matrix.platform == 'linux/amd64'
        env:
          NINE_IMAGE_TEST: "1"
          NINE_TEST_IMAGE: nine:verify
          NINE_TEST_VERSION: ${{ needs.meta.outputs.version }}
        run: go test -mod=vendor -v -timeout 10m ./tests/docker/...

  # ── Publish: multi-arch build, push, sign, attest ──────────────────────────
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [meta, verify]
    if: github.event_name == 'push' || inputs.push
    permissions:
      contents: write # create the GitHub release for the tag
      packages: write # push to GHCR
      id-token: write # keyless cosign signing and provenance attestation
      attestations: write
    env:
      # Job level, not step level: a step's own env block is not in scope for
      # that step's `if`, so the Docker Hub check below would always be empty.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # arm64 is emulated on an amd64 runner. Nine is pure Go with no cgo, so
      # this is a cross-compile in the go-build stage; qemu only carries the
      # debian stages' apt work.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional and currently unused: with no DOCKERHUB_USERNAME
      # secret set, the workflow publishes to GHCR alone rather than failing.
      #
      # Leave it that way while the GHCR package is private. Pushing to a Docker
      # Hub repository that does not exist yet creates it public, which would
      # publish an image the GHCR side is deliberately keeping private. Setting
      # the secrets is the opt-in, and it means creating the Docker Hub
      # repository first, with the visibility you actually want.
      - name: Log in to Docker Hub
        id: dockerhub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }},enable=${{ steps.dockerhub.outcome == 'success' }}
          # `latest` only on a real semver tag, and never on a prerelease: a
          # prerelease that moved `latest` would ship an untested default to
          # everyone running `docker pull nine`.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ needs.meta.outputs.build_date }}
          # An SBOM says what is in the image; provenance says how it was built.
          # Both ride along as attestations on the manifest.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless: the signature is bound to this workflow's OIDC identity and
      # recorded in the public Rekor transparency log. There is no private key
      # to store, leak, or rotate. docs/docker-image.md has the verify command.
      #
      # The signature itself lands in the (private) GHCR repository, but the
      # Rekor entry is public and carries this repository's name, the workflow
      # path and the image digest. That discloses that private releases are
      # happening, though not their contents. `--tlog-upload=false` suppresses
      # it, at the cost of needing `--insecure-ignore-tlog` to verify.
      - name: Sign the images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB_PUSHED: ${{ steps.dockerhub.outcome == 'success' }}
        run: |
          set -euo pipefail
          cosign sign --yes "${GHCR_IMAGE}@${DIGEST}"
          if [ "${DOCKERHUB_PUSHED}" = "true" ]; then
            cosign sign --yes "${DOCKERHUB_IMAGE}@${DIGEST}"
          fi

      # GitHub's attestation API is only available to public repositories on
      # Free/Pro/Team; a private repository needs GitHub Enterprise Cloud. This
      # repository is private, so the step is expected to fail and must not take
      # the release with it — by this point the image is already pushed, so a
      # hard failure would leave a published image behind a red run.
      #
      # The build's own `provenance: mode=max` and `sbom: true` above are
      # registry-side attestations on the manifest and are unaffected. Drop the
      # continue-on-error when the repository goes public.
      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        continue-on-error: true
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # A tag on its own is invisible: `gh release list` stays empty and there is
      # nowhere to read what changed. This turns each tag into a release page,
      # which works the same on a private repository.
      #
      # continue-on-error for the reason the attestation step above carries it:
      # the image is already pushed by now, so a failure here must not paint an
      # otherwise successful release red.
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; leaving it alone"
            exit 0
          fi
          # An annotated tag carries its own notes, used verbatim — so do not
          # repeat the version as its first line, or the release page shows it
          # twice under the title. A lightweight one has none,
          # so fall back to the commit list since the previous tag rather than
          # publishing an empty release.
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            git tag -l --format='%(contents)' "$TAG" > notes.md
          else
            prev="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
            if [ -n "$prev" ]; then
              git log --no-merges --format='- %s' "$prev..$TAG" > notes.md
            else
              git log --no-merges --format='- %s' "$TAG" > notes.md
            fi
          fi
          {
            echo
            echo '---'
            echo
            echo "Image: \`${GHCR_IMAGE}:${TAG#v}\`"
            echo "Digest: \`${DIGEST}\`"
          } >> notes.md
          # A prerelease is any tag with a hyphen (v1.2.3-rc1), matching the
          # `latest` gate in the metadata step above.
          flags=()
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file notes.md "${flags[@]}"

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo
            echo "Verify:"
            echo '```bash'
            echo "cosign verify ${GHCR_IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-image.yml@' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
