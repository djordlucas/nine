name: CI

on:
  push:
    branches: [main, security-hardening]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        run: make build

      # tests/evals/runner spins up a real in-process daemon per test and
      # deadlocks intermittently under CI load (the agent worker hangs on a
      # turn whose reply never arrives; see "Fix eval-runner daemon hang" in
      # the README roadmap). It is excluded from the CI gate until that is
      # fixed; the infra-free eval gate (make eval-replay) still runs below.
      - name: Test
        run: |
          go list -mod=vendor ./... | grep -v '/tests/evals/runner' | xargs go test -mod=vendor -timeout 20m

      - name: Eval gate (infra-free)
        run: make eval-replay

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          make lint

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: nine:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
