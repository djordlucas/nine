name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: a job that needs more says so itself. Without
# this block the workflow inherits the repository default, which may be
# read-write for every token in every job.
permissions:
  contents: read

# A pull request from a fork gets no CI. This repository accepts none
# (CONTRIBUTING.md), and what a fork's branch would run here is arbitrary code
# on the runner: the test suite starts a real daemon and the shell plugin, and
# the Docker jobs build a Dockerfile the pull request may have rewritten.
#
# GitHub's own control for this — Actions > Fork pull request workflows >
# require approval for all outside contributors — cannot be set while the
# repository is private (the API refuses it with 422), and its default only
# gates contributors it has not seen before. The condition below holds either
# way, so it stays after that setting is turned on.
jobs:
  build:
    name: Build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          # Both modules. The tools module builds the code generator and the
          # OpenAPI linter, whose trees are disjoint from nine's own — vacuum
          # alone is ~490 packages. Keyed on go.sum only, none of that is
          # cached and every run recompiles it from source.
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Build
        run: make build

      # The generated API code must match internal/api/openapi.yaml. Without
      # this the document and the server drift apart silently, which is the
      # failure the spec-first layout exists to prevent.
      - name: OpenAPI drift
        run: make openapi-check

      - name: OpenAPI lint
        run: make openapi-lint

      # tests/evals/runner spins up a real in-process daemon per test and
      # deadlocks intermittently under CI load (the agent worker hangs on a
      # turn whose reply never arrives; see "Fix eval-runner daemon hang" in
      # the README roadmap). It is excluded from the CI gate until that is
      # fixed; the infra-free eval gate (make eval-replay) still runs below.
      - name: Test
        run: |
          go list -mod=vendor ./... | grep -v '/tests/evals/runner' | xargs go test -mod=vendor -timeout 20m

      - name: Eval gate (infra-free)
        run: make eval-replay

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          make lint

  docker:
    name: Docker build and image tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum

      # The runtime stage is what gets published, so that is the one CI builds
      # and tests. Loading it into the daemon lets the image contract tests run
      # against the same artifact a release would push.
      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          tags: nine:test
          load: true
          push: false
          provenance: false
          build-args: |
            VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Catches a Dockerfile or s6 regression on the pull request that causes
      # it, rather than at release time when the tag is already cut.
      - name: Image contract tests
        env:
          NINE_IMAGE_TEST: "1"
          NINE_TEST_IMAGE: nine:test
          NINE_TEST_VERSION: ci-${{ github.sha }}
        run: go test -mod=vendor -v -timeout 15m ./tests/docker/...
