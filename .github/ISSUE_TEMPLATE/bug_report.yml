name: Bug report
description: Something in Nine does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities do not go here. Report those privately through the
        [Security tab](https://github.com/djordlucas/nine/security), per
        [SECURITY.md](https://github.com/djordlucas/nine/blob/main/.github/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Expected behaviour, then actual behaviour.
      placeholder: |
        Expected: `nine tools` lists the generated tool after `nine tools reload`.
        Actual: the tool is missing and no error is printed.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands or the conversation, in order.
      placeholder: |
        1. nine serve
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `nine version`.
      placeholder: "v4.2.0"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How it runs
      options:
        - Native binary
        - Docker image (ghcr.io/djordlucas/nine)
        - Built from source
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: >
        The relevant part of your nine.toml, if the bug touches configuration.
        Redact API keys and endpoints you do not want published.
      render: toml

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: >
        Run with NINE_LOG_LEVEL=debug where the failure is not self-explaining.
        Pasted here, this is formatted as code automatically.
      render: shell
