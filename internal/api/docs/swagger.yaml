basePath: /api/v1
definitions:
  api.AttachSessionRequest:
    properties:
      agent_id:
        type: string
    type: object
  api.AttachSessionResponse:
    properties:
      agent_id:
        type: string
      history:
        items: {}
        type: array
      instance_name:
        type: string
      name:
        type: string
      pending_response:
        type: string
      replay_events:
        items: {}
        type: array
      role:
        type: string
    type: object
  api.CallToolRequest:
    properties:
      args: {}
      live_state:
        type: boolean
    type: object
  api.CallToolResponse:
    properties:
      duration_ms:
        type: integer
      output:
        type: string
      success:
        type: boolean
      tool_name:
        type: string
    type: object
  api.ConversationInfo:
    properties:
      age_seconds:
        type: integer
      attached:
        type: boolean
      created_at:
        type: string
      events_count:
        type: integer
      id:
        type: string
      name:
        type: string
      plan_mode:
        type: string
      protected:
        type: boolean
      role:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  api.CreateConversationRequest:
    properties:
      interactive:
        type: boolean
    type: object
  api.CreateConversationResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      instance_name:
        type: string
      role:
        type: string
    type: object
  api.CreateGoalRequest:
    properties:
      description:
        type: string
      name:
        type: string
      priority:
        type: integer
    type: object
  api.CreateGoalResponse:
    properties:
      id:
        type: string
      session_id:
        type: string
      status:
        type: string
    type: object
  api.DeleteConversationResponse:
    properties:
      deleted_events:
        type: integer
      id:
        type: string
      message:
        type: string
    type: object
  api.DeleteGoalResponse:
    properties:
      id:
        type: string
      message:
        type: string
    type: object
  api.ErrorDetails:
    properties:
      code:
        type: string
      details:
        additionalProperties: {}
        type: object
      message:
        type: string
    type: object
  api.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/api.ErrorDetails'
    type: object
  api.FailWorkflowResponse:
    properties:
      id:
        type: string
      message:
        type: string
      status:
        type: string
    type: object
  api.GetContextResponse:
    properties:
      agent_id:
        type: string
      context: {}
    type: object
  api.GetConversationResponse:
    properties:
      context:
        additionalProperties: {}
        type: object
      created_at:
        type: string
      events_count:
        type: integer
      id:
        type: string
      name:
        type: string
      plan_mode:
        type: string
      protected:
        type: boolean
      role:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  api.GetDocsResponse:
    properties:
      content:
        type: string
      topic:
        type: string
    type: object
  api.GetGoalResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      parent_id:
        type: string
      parent_type:
        type: string
      status:
        type: string
      subtree:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  api.GetHistoryResponse:
    properties:
      agent_id:
        type: string
      data:
        items:
          $ref: '#/definitions/api.HistoryEntry'
        type: array
      pagination:
        $ref: '#/definitions/api.Pagination'
    type: object
  api.GetSpecResponse:
    properties:
      content:
        type: string
      topic:
        type: string
    type: object
  api.GetToolResponse:
    properties:
      capabilities:
        items:
          type: string
        type: array
      description:
        type: string
      generated:
        type: boolean
      input_schema: {}
      kind:
        type: string
      loaded:
        type: boolean
      manifest_path:
        type: string
      name:
        type: string
      plugin:
        type: string
    type: object
  api.GetTraceResponse:
    properties:
      agent_id:
        type: string
      sub_agents:
        type: boolean
      trace: {}
      turn:
        type: integer
    type: object
  api.GoalInfo:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      parent_id:
        type: string
      parent_type:
        type: string
      status:
        type: string
      subtree:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  api.HealthResponse:
    properties:
      daemon_connected:
        type: boolean
      status:
        type: string
      uptime_seconds:
        type: integer
      version:
        type: string
    type: object
  api.HistoryEntry:
    properties:
      agent_id:
        type: string
      text:
        type: string
      timestamp:
        type: string
      tool_input: {}
      tool_name:
        type: string
      tool_output:
        type: string
      turn_number:
        type: integer
      type:
        description: user_turn, response, tool_start, tool_end
        type: string
    type: object
  api.ListConversationsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/api.ConversationInfo'
        type: array
      pagination:
        $ref: '#/definitions/api.Pagination'
    type: object
  api.ListDocsResponse:
    properties:
      topics:
        items:
          type: string
        type: array
    type: object
  api.ListGoalsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/api.GoalInfo'
        type: array
      pagination:
        $ref: '#/definitions/api.Pagination'
    type: object
  api.ListNotificationsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/api.Notification'
        type: array
      pagination:
        $ref: '#/definitions/api.Pagination'
    type: object
  api.ListPluginsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/api.PluginInfo'
        type: array
      pagination:
        $ref: '#/definitions/api.Pagination'
    type: object
  api.ListSkillsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/api.SkillInfo'
        type: array
      pagination:
        $ref: '#/definitions/api.Pagination'
    type: object
  api.ListSpecResponse:
    properties:
      topics:
        items:
          type: string
        type: array
    type: object
  api.ListToolsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/api.ToolInfo'
        type: array
      pagination:
        $ref: '#/definitions/api.Pagination'
    type: object
  api.ListWorkflowsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/api.WorkflowInfo'
        type: array
      pagination:
        $ref: '#/definitions/api.Pagination'
    type: object
  api.MemoryStats:
    properties:
      events_count:
        type: integer
      memories_count:
        type: integer
      workflows_count:
        type: integer
    type: object
  api.Notification:
    properties:
      agent_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      message:
        type: string
      seen:
        type: boolean
    type: object
  api.Pagination:
    properties:
      has_more:
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  api.PluginInfo:
    properties:
      disabled:
        type: boolean
      error:
        type: string
      loaded:
        type: boolean
      name:
        type: string
      source:
        description: builtin, user
        type: string
      tools:
        items:
          type: string
        type: array
    type: object
  api.ReloadPluginsResponse:
    properties:
      failed_count:
        type: integer
      loaded_count:
        type: integer
      message:
        type: string
      plugins:
        items:
          $ref: '#/definitions/api.PluginInfo'
        type: array
    type: object
  api.ReloadToolsResponse:
    properties:
      message:
        type: string
      tools:
        items:
          $ref: '#/definitions/api.ToolInfo'
        type: array
    type: object
  api.ReplayRequest:
    properties:
      turn:
        type: integer
    type: object
  api.ReplayResponse:
    properties:
      agent_id:
        type: string
      result: {}
      turn:
        type: integer
    type: object
  api.SendMessageRequest:
    properties:
      force_think:
        type: boolean
      text:
        type: string
    type: object
  api.SendMessageResponse:
    properties:
      agent_id:
        type: string
      completed_at:
        type: string
      text:
        type: string
      turn_id:
        type: string
    type: object
  api.SkillInfo:
    properties:
      created_at:
        type: string
      description:
        type: string
      name:
        type: string
      source:
        description: builtin, user, generated
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  api.StatusResponse:
    properties:
      active_sessions:
        type: integer
      config:
        additionalProperties: true
        type: object
      memory:
        $ref: '#/definitions/api.MemoryStats'
      plugins:
        items:
          $ref: '#/definitions/api.PluginInfo'
        type: array
      status:
        type: string
      tools:
        items:
          $ref: '#/definitions/api.ToolInfo'
        type: array
      uptime:
        type: string
      version:
        type: string
    type: object
  api.StopConversationResponse:
    properties:
      id:
        type: string
      message:
        type: string
      status:
        type: string
    type: object
  api.StopWorkflowResponse:
    properties:
      id:
        type: string
      message:
        type: string
      status:
        type: string
    type: object
  api.ToolInfo:
    properties:
      capabilities:
        items:
          type: string
        type: array
      description:
        type: string
      error:
        type: string
      generated:
        type: boolean
      input_schema: {}
      kind:
        description: plugin, sandboxed, generated
        type: string
      loaded:
        type: boolean
      manifest_path:
        type: string
      name:
        type: string
      plugin:
        type: string
    type: object
  api.WorkflowInfo:
    properties:
      agent_id:
        type: string
      completed_steps:
        type: integer
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      status:
        description: active, done, failed, cancelled
        type: string
      steps:
        type: integer
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Nine
    url: https://github.com/djordlucas/nine
  description: |-
    HTTP/REST API for the Nine AI agent runtime. Provides feature parity with the CLI — conversations, goals, workflows, tools, plugins, skills, and more.
    The API runs as a separate process that communicates with the daemon via Unix socket.
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
  termsOfService: https://github.com/djordlucas/nine
  title: Nine API
  version: "1.0"
paths:
  /conversations:
    get:
      description: Returns all active, idle, and stopped conversations (agent sessions).
      parameters:
      - description: page size (default 50, max 1000)
        in: query
        name: limit
        type: integer
      - description: items to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ListConversationsResponse'
        "503":
          description: daemon unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List conversations
      tags:
      - conversations
    post:
      consumes:
      - application/json
      description: Creates a new conversation (agent session) with the daemon.
      parameters:
      - description: conversation config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateConversationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.CreateConversationResponse'
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: daemon unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a conversation
      tags:
      - conversations
  /conversations/{id}:
    delete:
      description: Deletes a conversation and all its event journal data.
      parameters:
      - description: conversation id
        in: path
        name: id
        required: true
        type: string
      - description: delete even when the conversation is protected
        in: query
        name: force
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.DeleteConversationResponse'
        "400":
          description: missing id
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: conversation not found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: daemon unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a conversation
      tags:
      - conversations
    get:
      description: Returns details and context for a specific conversation by ID.
      parameters:
      - description: conversation id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.GetConversationResponse'
        "400":
          description: missing id
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: conversation not found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: daemon unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get conversation details
      tags:
      - conversations
  /conversations/{id}/context:
    get:
      description: Returns the context builder breakdown for a conversation — token
        usage, sections, tool ranking.
      parameters:
      - description: conversation id
        in: path
        name: id
        required: true
        type: string
      - description: include the full per-section breakdown
        in: query
        name: verbose
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.GetContextResponse'
        "400":
          description: missing id
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: conversation not found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: daemon unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get conversation context
      tags:
      - conversations
  /conversations/{id}/history:
    get:
      description: Returns the ordered message and tool-call history for a conversation.
      parameters:
      - description: conversation id
        in: path
        name: id
        required: true
        type: string
      - description: page size (default 50, max 1000)
        in: query
        name: limit
        type: integer
      - description: items to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.GetHistoryResponse'
        "400":
          description: missing id
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get conversation history
      tags:
      - conversations
  /conversations/{id}/messages:
    post:
      consumes:
      - application/json
      description: Sends a user message to a conversation and returns the agent's
        response.
      parameters:
      - description: conversation id
        in: path
        name: id
        required: true
        type: string
      - description: message to send
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.SendMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SendMessageResponse'
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: conversation not found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: daemon unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send a message
      tags:
      - conversations
  /conversations/{id}/messages/stream:
    get:
      description: Opens a Server-Sent Events stream for a conversation, forwarding
        tool events and response chunks in real time.
      parameters:
      - description: conversation id
        in: path
        name: id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
        "400":
          description: missing id
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: daemon unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Stream conversation messages
      tags:
      - conversations
  /conversations/{id}/replay:
    post:
      consumes:
      - application/json
      description: Replays a specific turn in a conversation, re-running the LLM call
        and tool invocations.
      parameters:
      - description: conversation id
        in: path
        name: id
        required: true
        type: string
      - description: turn to replay
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ReplayRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ReplayResponse'
        "400":
          description: missing id or invalid body
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Replay a turn
      tags:
      - conversations
  /conversations/{id}/stop:
    post:
      description: Stops a conversation's session, ending the agent worker but preserving
        the event journal.
      parameters:
      - description: conversation id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.StopConversationResponse'
        "400":
          description: missing id
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: conversation not found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: daemon unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Stop a conversation
      tags:
      - conversations
  /conversations/{id}/trace:
    get:
      description: Returns the detailed LLM call and tool I/O trace for a specific
        turn in a conversation.
      parameters:
      - description: conversation id
        in: path
        name: id
        required: true
        type: string
      - description: 'turn number to trace (default: the latest turn)'
        in: query
        name: turn
        type: integer
      - description: include traces from sub-agent turns
        in: query
        name: sub_agents
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.GetTraceResponse'
        "400":
          description: missing id
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Trace a turn
      tags:
      - conversations
  /docs:
    get:
      description: Returns a list of available documentation topics.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ListDocsResponse'
      security:
      - BearerAuth: []
      summary: List documentation topics
      tags:
      - system
  /docs/{topic}:
    get:
      description: Returns the markdown content for a specific documentation topic.
      parameters:
      - description: documentation topic
        in: path
        name: topic
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.GetDocsResponse'
        "400":
          description: missing topic
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get documentation
      tags:
      - system
  /goals:
    get:
      description: Returns all goals (active, completed, failed, paused) across all
        sessions.
      parameters:
      - description: page size (default 50, max 1000)
        in: query
        name: limit
        type: integer
      - description: items to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ListGoalsResponse'
        "503":
          description: daemon unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List goals
      tags:
      - goals
    post:
      consumes:
      - application/json
      description: Creates a new background goal that spawns a session waking periodically
        to make progress.
      parameters:
      - description: goal definition
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateGoalRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.CreateGoalResponse'
        "400":
          description: invalid request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a goal
      tags:
      - goals
  /goals/{id}:
    delete:
      description: Deletes a goal and stops its background session.
      parameters:
      - description: goal id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.DeleteGoalResponse'
        "400":
          description: missing id
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a goal
      tags:
      - goals
    get:
      description: Returns details for a specific goal by ID, including progress and
        event count.
      parameters:
      - description: goal id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.GetGoalResponse'
        "400":
          description: missing id
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get goal details
      tags:
      - goals
  /health:
    get:
      description: Returns the API server health status, including daemon connectivity
        and uptime.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HealthResponse'
      summary: Check API health
      tags:
      - health
  /notifications:
    get:
      description: Returns user notifications, optionally including already-seen ones.
      parameters:
      - description: include notifications already marked seen
        in: query
        name: all
        type: boolean
      - description: page size (default 50, max 1000)
