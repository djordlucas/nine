        name: limit
        type: integer
      - description: items to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ListNotificationsResponse'
        "503":
          description: daemon unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
