  /workspace/file:
    get:
      operationId: getWorkspaceFile
      summary: Read a workspace file
      description: The file as it is, with its version as the ETag. Up to 32 MB; a larger file is taken with a backup.
      tags:
      - workspace
      parameters:
      - name: path
        in: query
        description: file path relative to the workspace root
        required: true
        schema:
          type: string
      - name: download
        in: query
        description: true to answer as an attachment, with the file name
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: the file
          headers:
            ETag:
              description: the file's version, for If-Match
              schema:
                type: string
            Last-Modified:
              description: when the file last changed
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: a path outside the workspace, a directory, or a file over 32 MB
          content: *id001
        '404':
          description: no such file
          content: *id001
        '409':
          description: no workspace is configured
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
      - cookieAuth: []
    put:
      operationId: putWorkspaceFile
      summary: Write a workspace file
      description: Creates the file, and any directories it needs, or replaces it. A replaced file goes to the trash, where the agent's trash_list and restore_file reach it. spill/ is reserved.
      tags:
      - workspace
      parameters:
      - name: path
        in: query
        description: file path relative to the workspace root
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: the version the file was read at (its ETag); the change fails with 409 if the file has
          changed since
        required: false
        schema:
          type: string
      requestBody:
        description: the file's content, up to 32 MB
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEntry'
        '400':
          description: a path outside the workspace or reserved, a directory, or over 32 MB
          content: *id001
        '409':
          description: the file changed since it was read, or no workspace is configured
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
      - cookieAuth: []
    delete:
      operationId: deleteWorkspaceFile
      summary: Delete a workspace file
      description: Moves a file to the trash, or removes an empty directory.
      tags:
      - workspace
      parameters:
      - name: path
        in: query
        description: file or directory path relative to the workspace root
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: the version the file was read at (its ETag); the change fails with 409 if the file has
          changed since
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEntry'
        '400':
          description: a path outside the workspace, the root, or a directory that is not empty
          content: *id001
        '404':
          description: no such file
          content: *id001
        '409':
          description: the file changed since it was read, or no workspace is configured
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
      - cookieAuth: []
