  /capabilities:
    get:
      operationId: listCapabilities
      summary: List capability grants and requests
      description: |
        Returns the generated-tool capability ceiling in force and every request the
        agent has made to widen it.

        A grant's source is `default` (derived from the workspace root), `config`
        (from nine.toml) or `approved` (conferred by an operator answering a
        request). The first two are rewritten from the file at every daemon boot;
        only `approved` grants persist across one independently.
      tags:
      - capabilities
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /capabilities/{id}/decision:
    post:
      operationId: decideCapability
      summary: Approve, deny or revoke a capability
      description: |
        Settles a pending capability request, or revokes a grant an earlier approval
        conferred.

        The decision applies to the running daemon: an approval widens the ceiling
        and a revocation narrows it, and the generated tool catalog is re-projected
        against the result, so a tool that could not load becomes callable — or
        stops being — on its next turn, with no restart.

        `approve` and `deny` take a request id; `revoke` takes a grant id. Only an
        `approved` grant is revocable, because a `config` or `default` grant is
        rewritten from nine.toml at the next boot.
      tags:
      - capabilities
      parameters:
      - name: id
        in: path
        description: request id for approve/deny, grant id for revoke
        required: true
        schema:
          type: string
      requestBody:
        description: the decision to apply
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityDecisionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityDecisionResponse'
        '400':
          description: unknown action, or no such request or grant
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
