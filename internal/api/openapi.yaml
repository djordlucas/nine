openapi: 3.1.0
info:
  title: Nine API
  version: '1.0'
  description: 'HTTP/REST API for the Nine AI agent runtime. Provides feature parity with the CLI — conversations,
    goals, workflows, tools, plugins, skills, and more.

    The API runs as a separate process that communicates with the daemon via Unix socket.'
  license:
    name: GPL-3.0-only
    identifier: GPL-3.0-only
  contact:
    name: Nine
    url: https://github.com/djordlucas/nine
servers:
- url: '{scheme}://{host}:{port}/api/v1'
  description: A running nine API server
  variables:
    scheme:
      enum:
      - http
      - https
      default: http
    host:
      default: localhost
    port:
      default: '8080'
tags:
- name: health
  description: Server health and daemon status.
- name: conversations
  description: 'Agent sessions: create, send a turn, inspect context, stop, delete.'
- name: goals
  description: Background goals and the sessions that pursue them.
- name: workflows
  description: Multi-step workflows and their lifecycle.
- name: tools
  description: The tool roster and direct tool invocation.
- name: plugins
  description: Plugin roster and reload.
- name: notifications
  description: The human-facing notification feed.
- name: skills
  description: Skill roster.
- name: sessions
  description: Attaching to a running session.
- name: system
  description: Bundled documentation and specification.
- name: capabilities
  description: The generated-tool capability ceiling, and the agent's requests to widen it.
- name: processes
  description: 'Everything Nine runs between turns: list, inspect, start, stop, message.'
paths:
  /conversations:
    get:
      operationId: listConversations
      summary: List conversations
      description: Returns all active, idle, and stopped conversations (agent sessions).
      tags:
      - conversations
      parameters:
      - name: limit
        in: query
        description: Maximum items to return
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - name: offset
        in: query
        description: Items to skip before the page
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListConversationsResponse'
        '400':
          description: invalid paging
          content: &id001
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
    post:
      operationId: createConversation
      summary: Create a conversation
      description: Creates a new conversation (agent session) with the daemon.
      tags:
      - conversations
      requestBody:
        description: conversation config
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateConversationResponse'
        '400':
          description: invalid request body
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /conversations/{id}:
    get:
      operationId: getConversation
      summary: Get conversation details
      description: Returns details and context for a specific conversation by ID.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConversationResponse'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
    delete:
      operationId: deleteConversation
      summary: Delete a conversation
      description: Deletes a conversation and all its event journal data.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      - name: force
        in: query
        description: delete even when the conversation is protected
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteConversationResponse'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /conversations/{id}/context:
    get:
      operationId: getConversationContext
      summary: Get conversation context
      description: Returns the context builder breakdown for a conversation — token usage, sections, tool
        ranking.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      - name: verbose
        in: query
        description: include the full per-section breakdown
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContextResponse'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /conversations/{id}/history:
    get:
      operationId: getConversationHistory
      summary: Get conversation history
      description: Returns a conversation's whole transcript from the event journal, oldest first — user
        prompts, tool and sub-agent activity, and responses — across every turn. Reading it does not attach
        to the session.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum items to return
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - name: offset
        in: query
        description: Items to skip before the page
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationHistoryResponse'
        '400':
          description: missing id or invalid paging
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /conversations/{id}/messages:
    post:
      operationId: sendMessage
      summary: Send a message
      description: Sends a user message to a conversation and returns the agent's response.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      requestBody:
        description: message to send
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '400':
          description: missing id or empty text
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /conversations/{id}/messages/stream:
    get:
      operationId: streamMessages
      summary: Stream conversation messages
      description: Opens a Server-Sent Events stream that follows a conversation for as long as the client
        stays connected. Every turn the session runs is forwarded — whether this client, another client,
        or the session's own idle schedule started it — as tool, sub-agent, notice and response-chunk events,
        then response (or error) and done.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: An event stream. Each event carries a JSON payload; the event name selects which
            member of StreamEvent it is.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /conversations/{id}/replay:
    post:
      operationId: replayTurn
      summary: Replay a turn
      description: Reconstructs one turn from the event journal, as `nine replay` does — each LLM request
        and response, each tool call with its I/O, sub-agents, and the result. Nothing is re-executed; the
        model is not called and no tool runs.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      requestBody:
        description: which turn to reconstruct
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayTurnRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayTurnResponse'
        '400':
          description: missing id or turn
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation or turn not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /conversations/{id}/stop:
    post:
      operationId: stopConversation
      summary: Stop a conversation
      description: Stops a conversation's session, ending the agent worker but preserving the event journal.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopConversationResponse'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /conversations/{id}/trace:
    get:
      operationId: getConversationTrace
      summary: Trace a conversation
      description: Returns a conversation's event journal as `nine trace` shows it — every event with its
        turn, span and payload — for every turn, or for one. With sub_agents, the trace of every sub-agent
        spawned in those events is included too, recursively, each linked to the event that spawned it.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      - name: turn
        in: query
        description: the turn to trace; 0 traces every turn
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: sub_agents
        in: query
        description: nest each spawned sub-agent's trace under its spawn event
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceResponse'
        '400':
          description: missing id or invalid turn
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /docs:
    get:
      operationId: listDocs
      summary: List documentation topics
      description: Returns a list of available documentation topics.
      tags:
      - system
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDocsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
      security:
      - bearerAuth: []
  /docs/{topic}:
    get:
      operationId: getDocs
      summary: Get documentation
      description: Returns the markdown content for a specific documentation topic.
      tags:
      - system
      parameters:
      - name: topic
        in: path
        description: documentation topic
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocsResponse'
        '400':
          description: missing topic
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: topic not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
  /goals:
    get:
      operationId: listGoals
      summary: List goals
      description: Returns all goals (active, completed, failed, paused) across all sessions.
      tags:
      - goals
      parameters:
      - name: limit
        in: query
        description: Maximum items to return
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - name: offset
        in: query
        description: Items to skip before the page
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGoalsResponse'
        '400':
          description: invalid paging
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
    post:
      operationId: createGoal
      summary: Create a goal
      description: Creates a goal as the operator. A top-level goal gets a background session that wakes
        periodically to pursue it, unless the daemon is at its goal-session cap; a sub-goal (parent_id set)
        is worked on by the session pursuing its parent and gets none.
      tags:
      - goals
      requestBody:
        description: the goal to create
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGoalResponse'
        '400':
          description: missing description
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: parent goal not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /goals/{id}:
    get:
      operationId: getGoal
      summary: Get goal details
      description: Returns details for a specific goal by ID, including progress and event count.
      tags:
      - goals
      parameters:
      - name: id
        in: path
        description: goal id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGoalResponse'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: goal not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
    delete:
      operationId: deleteGoal
      summary: Delete a goal
      description: Deletes a goal and its sub-goals and stops the goal's background session. The session's
        transcript and journal are kept. A goal declared by an [[agent]] block in nine.toml is refused with
        409, since the next boot would re-create it.
      tags:
      - goals
      parameters:
      - name: id
        in: path
        description: goal id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteGoalResponse'
        '400':
          description: missing id
          content: *id001
        '409':
          description: goal is declared in nine.toml
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: goal not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /health:
    get:
      operationId: getHealth
      summary: Check API health
      description: Returns the API server health status, including daemon connectivity and uptime.
      tags:
      - health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      security: []
  /notifications:
    get:
      operationId: listNotifications
      summary: List notifications
      description: Returns user notifications, optionally including already-seen ones.
      tags:
      - notifications
      parameters:
      - name: all
        in: query
        description: include notifications already marked seen
        schema:
          type: boolean
      - name: limit
        in: query
        description: Maximum items to return
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - name: offset
        in: query
        description: Items to skip before the page
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListNotificationsResponse'
        '400':
          description: invalid paging
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /plugins:
    get:
      operationId: listPlugins
      summary: List plugins
      description: Returns all plugins (builtin and user), their loaded status, tools, and errors.
      tags:
      - plugins
      parameters:
      - name: limit
        in: query
        description: Maximum items to return
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - name: offset
        in: query
        description: Items to skip before the page
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPluginsResponse'
        '400':
          description: invalid paging
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /plugins/reload:
    post:
      operationId: reloadPlugins
      summary: Reload plugins
      description: Reloads user plugins from the filesystem, returning the new loaded set.
      tags:
      - plugins
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReloadPluginsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /processes:
    get:
      operationId: listProcesses
      summary: List processes
      description: Returns every process — goal sessions, standing agents, reflection, condition triggers, standing tools — with its state, who stopped it, its trigger and its budget use.
      tags:
      - processes
      parameters:
      - name: limit
        in: query
        description: Maximum items to return
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - name: offset
        in: query
        description: Items to skip before the page
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProcessesResponse'
        '400':
          description: invalid request
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /processes/{id}:
    get:
      operationId: getProcess
      summary: Get a process
      description: Returns one process with its recent activity, which is kept in memory and empties on restart.
      tags:
      - processes
      parameters:
      - name: id
        in: path
        description: process id, as the roster shows it
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: no process with that id
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /processes/{id}/start:
    post:
      operationId: startProcess
      summary: Start a process
      description: Starts a stopped or failing process as the operator, who may start any process. Refused with 409 when it is already running or [processes] max_running processes are.
      tags:
      - processes
      parameters:
      - name: id
        in: path
        description: process id, as the roster shows it
        required: true
        schema:
          type: string
      responses:
        '200':
          description: started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: no process with that id
