openapi: 3.1.0
info:
  title: Nine API
  version: '1.0'
  description: 'HTTP/REST API for the Nine AI agent runtime. Provides feature parity with the CLI — conversations,
    goals, workflows, tools, plugins, skills, and more.

    The API runs as a separate process that communicates with the daemon via Unix socket.'
  license:
    name: GPL-3.0-only
    identifier: GPL-3.0-only
  contact:
    name: Nine
    url: https://github.com/djordlucas/nine
servers:
- url: '{scheme}://{host}:{port}/api/v1'
  description: A running nine API server
  variables:
    scheme:
      enum:
      - http
      - https
      default: http
    host:
      default: localhost
    port:
      default: '8080'
tags:
- name: auth
  description: 'Browser sign-in: exchange the API token for a session cookie.'
- name: health
  description: Server health and daemon status.
- name: conversations
  description: 'Agent sessions: create, send a turn, inspect context, stop, delete.'
- name: goals
  description: Background goals and the sessions that pursue them.
- name: workflows
  description: Multi-step workflows and their lifecycle.
- name: tools
  description: The tool roster and direct tool invocation.
- name: plugins
  description: Plugin roster and reload.
- name: notifications
  description: The human-facing notification feed.
- name: skills
  description: Skill roster.
- name: sessions
  description: Attaching to a running session.
- name: system
  description: Bundled documentation and specification.
- name: capabilities
  description: The generated-tool capability ceiling, and the agent's requests to widen it.
- name: processes
  description: 'Everything Nine runs between turns: list, inspect, start, stop, message.'
- name: events
  description: 'The daemon-wide journal, live: every session''s events and the state changes the store
    records.'
- name: questions
  description: ask_human questions waiting for an answer.
- name: workspace
  description: "The workspace's files: browse, read, write, delete. Nine's own state stays private."
- name: database
  description: 'The database processes keep their records in: tables, rows, statements.'
paths:
  /auth/session:
    get:
      operationId: getAuthSession
      summary: Get the browser session
      description: Reports whether the server requires a token and whether this request is signed in. A
        request signed in with the session cookie also gets the CSRF token its writes must carry.
      tags:
      - auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
    post:
      operationId: createAuthSession
      summary: Sign in
      description: Exchanges the API token for a session cookie (HttpOnly, SameSite=Strict). The response
        carries the CSRF token that cookie-authenticated writes send as X-Nine-CSRF.
      tags:
      - auth
      requestBody:
        description: the API token
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthSessionRequest'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              description: the session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
    delete:
      operationId: deleteAuthSession
      summary: Sign out
      description: Ends this browser session and clears its cookie. Succeeds with no session too.
      tags:
      - auth
      responses:
        '204':
          description: Signed out
          headers:
            Set-Cookie:
              description: the expired session cookie
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /config:
    get:
      operationId: getConfig
      summary: Get the configuration
      description: Returns the configuration the daemon runs with — the file, then the NINE_* overrides — as
        TOML. Only what is set is shown; an unset setting takes its default. Every credential (a key, token,
        secret or password, and an MCP server's env and headers) is replaced by "(set, hidden)".
      tags:
      - health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: daemon unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /conversations:
    get:
      operationId: listConversations
      summary: List conversations
      description: Returns all active, idle, and stopped conversations (agent sessions).
      tags:
      - conversations
      parameters:
      - name: limit
        in: query
        description: Maximum items to return
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - name: offset
        in: query
        description: Items to skip before the page
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListConversationsResponse'
        '400':
          description: invalid paging
          content: &id001
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
      - cookieAuth: []
    post:
      operationId: createConversation
      summary: Create a conversation
      description: Creates a new conversation (agent session) with the daemon.
      tags:
      - conversations
      requestBody:
        description: conversation config
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateConversationResponse'
        '400':
          description: invalid request body
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
      - cookieAuth: []
  /conversations/{id}:
    get:
      operationId: getConversation
      summary: Get conversation details
      description: Returns details and context for a specific conversation by ID.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConversationResponse'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
      - cookieAuth: []
    patch:
      operationId: renameConversation
      summary: Rename a conversation
      description: Gives a conversation a display name, in place of the one inferred from its first message.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameConversationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenameConversationResponse'
        '400':
          description: missing id, or a name that is empty, longer than 80 characters or more than one line
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
      - cookieAuth: []
    delete:
      operationId: deleteConversation
      summary: Delete a conversation
      description: Deletes a conversation and all its event journal data.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      - name: force
        in: query
        description: delete even when the conversation is protected
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteConversationResponse'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
      - cookieAuth: []
  /conversations/{id}/context:
    get:
      operationId: getConversationContext
      summary: Get conversation context
      description: Returns the context builder breakdown for a conversation — token usage, sections, tool
        ranking.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      - name: verbose
        in: query
        description: include the full per-section breakdown
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContextResponse'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
      - cookieAuth: []
  /conversations/{id}/history:
    get:
      operationId: getConversationHistory
      summary: Get conversation history
      description: Returns a conversation's whole transcript from the event journal, oldest first — user
        prompts, tool and sub-agent activity, and responses — across every turn. Reading it does not attach
        to the session.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum items to return
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - name: offset
        in: query
        description: Items to skip before the page
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationHistoryResponse'
        '400':
          description: missing id or invalid paging
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
      - cookieAuth: []
  /conversations/{id}/messages:
    post:
      operationId: sendMessage
      summary: Send a message
      description: Sends a user message to a conversation and returns the agent's response.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      requestBody:
        description: message to send
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '400':
          description: missing id or empty text
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
      - cookieAuth: []
  /conversations/{id}/messages/stream:
    get:
      operationId: streamMessages
      summary: Stream conversation messages
      description: Opens a Server-Sent Events stream that follows a conversation for as long as the client
        stays connected. Every turn the session runs is forwarded — whether this client, another client,
        or the session's own idle schedule started it — as tool, sub-agent, notice and response-chunk events,
        then response (or error) and done.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: An event stream. Each event carries a JSON payload; the event name selects which
            member of StreamEvent it is.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
      - cookieAuth: []
  /conversations/{id}/replay:
    post:
      operationId: replayTurn
      summary: Replay a turn
      description: Reconstructs one turn from the event journal, as `nine replay` does — each LLM request
        and response, each tool call with its I/O, sub-agents, and the result. Nothing is re-executed; the
        model is not called and no tool runs.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      requestBody:
        description: which turn to reconstruct
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayTurnRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayTurnResponse'
        '400':
          description: missing id or turn
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation or turn not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
      - cookieAuth: []
  /conversations/{id}/cancel:
    post:
      operationId: cancelTurn
      summary: Cancel the running turn
      description: Cancels the turn a conversation is running. The turn ends with the error "turn cancelled",
        which every stream following the conversation receives; the session, its history and its checkpoint
        stay, and a queued message still runs. cancelled is false when no turn was running.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelTurnResponse'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
      - cookieAuth: []
  /conversations/{id}/stop:
    post:
      operationId: stopConversation
      summary: Stop a conversation
      description: Ends a conversation's session. Its worker stops, its checkpoint is deleted and the processes
        it drives are stopped; the journal and transcript stay. To interrupt only the turn in progress, use
        cancel.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopConversationResponse'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
      - cookieAuth: []
  /conversations/{id}/trace:
    get:
      operationId: getConversationTrace
      summary: Trace a conversation
      description: Returns a conversation's event journal as `nine trace` shows it — every event with its
        turn, span and payload — for every turn, or for one. With sub_agents, the trace of every sub-agent
        spawned in those events is included too, recursively, each linked to the event that spawned it.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      - name: turn
        in: query
        description: the turn to trace; 0 traces every turn
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: sub_agents
        in: query
        description: nest each spawned sub-agent's trace under its spawn event
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceResponse'
        '400':
          description: missing id or invalid turn
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
      - cookieAuth: []
  /docs:
    get:
      operationId: listDocs
      summary: List documentation topics
      description: Returns a list of available documentation topics.
      tags:
      - system
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDocsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
      security:
      - bearerAuth: []
      - cookieAuth: []
  /docs/{topic}:
    get:
      operationId: getDocs
      summary: Get documentation
      description: Returns the markdown content for a specific documentation topic.
      tags:
      - system
      parameters:
      - name: topic
        in: path
        description: documentation topic
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocsResponse'
        '400':
          description: missing topic
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: topic not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /events:
    get:
      operationId: streamEvents
      summary: Follow the journal
      description: 'Opens a Server-Sent Events stream of the daemon''s journal: every session''s events and
        the state changes the store records (approvals, questions, notifications, goals, workflows). Each
        journal event is sent as an event named journal whose SSE id is its seq, so a client that reconnects
        with Last-Event-ID (or after) misses nothing still in the journal. A position the journal can no
        longer honour (scrubbed, more than 10000 events behind, or from another journal) is answered with
        a reset event, and the stream continues from now. A payload over 16 KB is replaced by {"omitted":
        true, "bytes": N}; the conversation''s trace has it in full.'
      tags:
      - events
      parameters:
      - name: type
        in: query
        description: Only these event types. A value ending in * matches every type with that prefix (process_*).
          Repeatable.
        schema:
          type: array
          items:
            type: string
        explode: true
      - name: agent
        in: query
        description: Only events of these sessions or processes (the journal's agent_id). Repeatable.
        schema:
          type: array
          items:
            type: string
        explode: true
      - name: after
        in: query
        description: Resume after this seq. Last-Event-ID takes precedence. Without either, the stream starts
          from now.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: tail
        in: query
        description: For a stream starting from now, how many earlier journal events to send first (before
          the type and agent filters).
        schema:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
      - name: Last-Event-ID
        in: header
        description: The id of the last event received, which a browser's EventSource sends on reconnect.
        schema:
          type: string
      responses:
        '200':
          description: An event stream. The event name (connected, journal, reset, error) selects the member
            of EventsStreamEvent.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/EventsStreamEvent'
        '400':
          description: invalid parameters
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
      - cookieAuth: []
  /reflections:
    get:
      operationId: listReflections
      summary: List reflections
      description: What a reflecting session concluded, one entry per turn that ended with a result, oldest
        first, as `nine reflections` prints it. Without agent, the daemon's own self-reflection.
      tags:
      - system
      parameters:
      - name: agent
        in: query
        description: the reflecting session; self-reflection when absent
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListReflectionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
      - cookieAuth: []
  /sessions:
    get:
      operationId: listSessions
      summary: List every session
      description: The session roster, as `nine sessions` prints it, process sessions included. Conversations
        alone are under /conversations.
      tags:
      - system
      parameters:
      - name: limit
        in: query
        description: Maximum items to return
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - name: offset
        in: query
        description: Items to skip before the page
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSessionsResponse'
        '400':
          description: invalid request
          content: *id001
        '401':
