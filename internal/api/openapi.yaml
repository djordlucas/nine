openapi: 3.1.0
info:
  title: Nine API
  version: '1.0'
  description: 'HTTP/REST API for the Nine AI agent runtime. Provides feature parity with the CLI — conversations,
    goals, workflows, tools, plugins, skills, and more.

    The API runs as a separate process that communicates with the daemon via Unix socket.'
  license:
    name: GPL-3.0-only
    identifier: GPL-3.0-only
  contact:
    name: Nine
    url: https://github.com/djordlucas/nine
servers:
- url: '{scheme}://{host}:{port}/api/v1'
  description: A running nine API server
  variables:
    scheme:
      enum:
      - http
      - https
      default: http
    host:
      default: localhost
    port:
      default: '8080'
tags:
- name: health
  description: Server health and daemon status.
- name: conversations
  description: 'Agent sessions: create, send a turn, inspect context, stop, delete.'
- name: goals
  description: Background goals and the sessions that pursue them.
- name: workflows
  description: Multi-step workflows and their lifecycle.
- name: tools
  description: The tool roster and direct tool invocation.
- name: plugins
  description: Plugin roster and reload.
- name: notifications
  description: The human-facing notification feed.
- name: skills
  description: Skill roster.
- name: sessions
  description: Attaching to a running session.
- name: system
  description: Bundled documentation and specification.
- name: capabilities
  description: The generated-tool capability ceiling, and the agent's requests to widen it.
paths:
  /conversations:
    get:
      operationId: listConversations
      summary: List conversations
      description: Returns all active, idle, and stopped conversations (agent sessions).
      tags:
      - conversations
      parameters:
      - name: limit
        in: query
        description: Maximum items to return
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - name: offset
        in: query
        description: Items to skip before the page
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListConversationsResponse'
        '400':
          description: invalid paging
          content: &id001
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
    post:
      operationId: createConversation
      summary: Create a conversation
      description: Creates a new conversation (agent session) with the daemon.
      tags:
      - conversations
      requestBody:
        description: conversation config
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateConversationResponse'
        '400':
          description: invalid request body
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /conversations/{id}:
    get:
      operationId: getConversation
      summary: Get conversation details
      description: Returns details and context for a specific conversation by ID.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConversationResponse'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
    delete:
      operationId: deleteConversation
      summary: Delete a conversation
      description: Deletes a conversation and all its event journal data.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      - name: force
        in: query
        description: delete even when the conversation is protected
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteConversationResponse'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /conversations/{id}/context:
    get:
      operationId: getConversationContext
      summary: Get conversation context
      description: Returns the context builder breakdown for a conversation — token usage, sections, tool
        ranking.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      - name: verbose
        in: query
        description: include the full per-section breakdown
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContextResponse'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /conversations/{id}/history:
    get:
      operationId: getConversationHistory
      summary: Get conversation history
      description: Returns the ordered message and tool-call history for a conversation.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '501':
          description: not implemented
          content: *id001
      security:
      - bearerAuth: []
  /conversations/{id}/messages:
    post:
      operationId: sendMessage
      summary: Send a message
      description: Sends a user message to a conversation and returns the agent's response.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      requestBody:
        description: message to send
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '400':
          description: missing id or empty text
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /conversations/{id}/messages/stream:
    get:
      operationId: streamMessages
      summary: Stream conversation messages
      description: Opens a Server-Sent Events stream for a conversation, forwarding tool events and response
        chunks in real time.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: An event stream. Each event carries a JSON payload; the event name selects which
            member of StreamEvent it is.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /conversations/{id}/replay:
    post:
      operationId: replayTurn
      summary: Replay a turn
      description: Replays a specific turn in a conversation, re-running the LLM call and tool invocations.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '501':
          description: not implemented
          content: *id001
      security:
      - bearerAuth: []
  /conversations/{id}/stop:
    post:
      operationId: stopConversation
      summary: Stop a conversation
      description: Stops a conversation's session, ending the agent worker but preserving the event journal.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopConversationResponse'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: conversation not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /conversations/{id}/trace:
    get:
      operationId: getConversationTrace
      summary: Trace a turn
      description: Returns the detailed LLM call and tool I/O trace for a specific turn in a conversation.
      tags:
      - conversations
      parameters:
      - name: id
        in: path
        description: conversation id
        required: true
        schema:
          type: string
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '501':
          description: not implemented
          content: *id001
      security:
      - bearerAuth: []
  /docs:
    get:
      operationId: listDocs
      summary: List documentation topics
      description: Returns a list of available documentation topics.
      tags:
      - system
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDocsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
      security:
      - bearerAuth: []
  /docs/{topic}:
    get:
      operationId: getDocs
      summary: Get documentation
      description: Returns the markdown content for a specific documentation topic.
      tags:
      - system
      parameters:
      - name: topic
        in: path
        description: documentation topic
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocsResponse'
        '400':
          description: missing topic
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: topic not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
  /goals:
    get:
      operationId: listGoals
      summary: List goals
      description: Returns all goals (active, completed, failed, paused) across all sessions.
      tags:
      - goals
      parameters:
      - name: limit
        in: query
        description: Maximum items to return
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - name: offset
        in: query
        description: Items to skip before the page
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGoalsResponse'
        '400':
          description: invalid paging
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
    post:
      operationId: createGoal
      summary: Create a goal
      description: Creates a new background goal that spawns a session waking periodically to make progress.
      tags:
      - goals
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '501':
          description: not implemented
          content: *id001
      security:
      - bearerAuth: []
  /goals/{id}:
    get:
      operationId: getGoal
      summary: Get goal details
      description: Returns details for a specific goal by ID, including progress and event count.
      tags:
      - goals
      parameters:
      - name: id
        in: path
        description: goal id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGoalResponse'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: goal not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
    delete:
      operationId: deleteGoal
      summary: Delete a goal
      description: Deletes a goal and stops its background session.
      tags:
      - goals
      parameters:
      - name: id
        in: path
        description: goal id
        required: true
        schema:
          type: string
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '501':
          description: not implemented
          content: *id001
      security:
      - bearerAuth: []
  /health:
    get:
      operationId: getHealth
      summary: Check API health
      description: Returns the API server health status, including daemon connectivity and uptime.
      tags:
      - health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      security: []
  /notifications:
    get:
      operationId: listNotifications
      summary: List notifications
      description: Returns user notifications, optionally including already-seen ones.
      tags:
      - notifications
      parameters:
      - name: all
        in: query
        description: include notifications already marked seen
        schema:
          type: boolean
      - name: limit
        in: query
        description: Maximum items to return
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - name: offset
        in: query
        description: Items to skip before the page
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListNotificationsResponse'
        '400':
          description: invalid paging
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /plugins:
    get:
      operationId: listPlugins
      summary: List plugins
      description: Returns all plugins (builtin and user), their loaded status, tools, and errors.
      tags:
      - plugins
      parameters:
      - name: limit
        in: query
        description: Maximum items to return
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - name: offset
        in: query
        description: Items to skip before the page
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPluginsResponse'
        '400':
          description: invalid paging
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /plugins/reload:
    post:
      operationId: reloadPlugins
      summary: Reload plugins
      description: Reloads user plugins from the filesystem, returning the new loaded set.
      tags:
      - plugins
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReloadPluginsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /sessions/attach:
    post:
      operationId: attachSession
      summary: Attach to a session
      description: Attaches to an existing conversation session, returning replay events, history, and
        any pending response.
      tags:
      - sessions
      requestBody:
        description: session to attach to
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachSessionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachSessionResponse'
        '400':
          description: invalid request body
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: session not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /skills:
    get:
      operationId: listSkills
      summary: List skills
      description: Returns all available skills (builtin, user, and generated) with names, descriptions,
        and tags.
      tags:
      - skills
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '501':
          description: not implemented
          content: *id001
      security:
      - bearerAuth: []
  /spec:
    get:
      operationId: listSpec
      summary: List specification topics
      description: Returns a list of available specification topics.
      tags:
      - system
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSpecResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
      security:
      - bearerAuth: []
  /spec/{topic}:
    get:
      operationId: getSpec
      summary: Get specification
      description: Returns the markdown content for a specific specification topic.
      tags:
      - system
      parameters:
      - name: topic
        in: path
        description: specification topic
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSpecResponse'
        '400':
          description: missing topic
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: topic not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
  /status:
    get:
      operationId: getStatus
      summary: Get daemon status
      description: Returns the daemon's current status, including sessions, plugins, tools, and memory
        stats.
      tags:
      - health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /tools:
    get:
      operationId: listTools
      summary: List tools
      description: Returns all available tools (plugins, sandboxed, and generated).
      tags:
      - tools
      parameters:
      - name: limit
        in: query
        description: Maximum items to return
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - name: offset
        in: query
        description: Items to skip before the page
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListToolsResponse'
        '400':
          description: invalid paging
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /capabilities:
    get:
      operationId: listCapabilities
      summary: List capability grants and requests
      description: |
        Returns the generated-tool capability ceiling in force and every request the
        agent has made to widen it.

        A grant's source is `default` (derived from the workspace root), `config`
        (from nine.toml) or `approved` (conferred by an operator answering a
        request). The first two are rewritten from the file at every daemon boot;
        only `approved` grants persist across one independently.
      tags:
      - capabilities
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /capabilities/{id}/decision:
    post:
      operationId: decideCapability
      summary: Approve, deny or revoke a capability
      description: |
        Settles a pending capability request, or revokes a grant an earlier approval
        conferred.

        The decision applies to the running daemon: an approval widens the ceiling
        and a revocation narrows it, and the generated tool catalog is re-projected
        against the result, so a tool that could not load becomes callable — or
        stops being — on its next turn, with no restart.

        `approve` and `deny` take a request id; `revoke` takes a grant id. Only an
        `approved` grant is revocable, because a `config` or `default` grant is
        rewritten from nine.toml at the next boot.
      tags:
      - capabilities
      parameters:
      - name: id
        in: path
        description: request id for approve/deny, grant id for revoke
        required: true
        schema:
          type: string
      requestBody:
        description: the decision to apply
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityDecisionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityDecisionResponse'
        '400':
          description: unknown action, or no such request or grant
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /tools/reload:
    post:
      operationId: reloadTools
      summary: Reload tools
      description: Reloads sandboxed and generated tools from the filesystem.
      tags:
      - tools
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReloadToolsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /tools/{name}:
    get:
      operationId: getTool
      summary: Get tool details
      description: Returns details for a specific tool by name, including input schema and capabilities.
      tags:
      - tools
      parameters:
      - name: name
        in: path
        description: tool name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetToolResponse'
        '400':
          description: missing name
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: tool not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /tools/{name}/call:
    post:
      operationId: callTool
      summary: Call a tool
      description: Invokes a tool by name with the given arguments, bypassing the agent loop.
      tags:
      - tools
      parameters:
      - name: name
        in: path
        description: tool name
        required: true
        schema:
          type: string
      requestBody:
        description: tool call arguments
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallToolRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallToolResponse'
        '400':
          description: missing name or invalid args
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: tool not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /workflows:
    get:
      operationId: listWorkflows
      summary: List workflows
      description: Returns all workflows (running, completed, failed, cancelled) across all sessions.
      tags:
      - workflows
      parameters:
      - name: limit
        in: query
        description: Maximum items to return
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - name: offset
        in: query
        description: Items to skip before the page
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowsResponse'
        '400':
          description: invalid paging
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /workflows/{id}/fail:
    post:
      operationId: failWorkflow
      summary: Fail a workflow
      description: Marks a workflow as failed by ID.
      tags:
      - workflows
      parameters:
      - name: id
        in: path
        description: workflow id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailWorkflowResponse'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: workflow not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
  /workflows/{id}/stop:
    post:
      operationId: stopWorkflow
      summary: Stop a workflow
      description: Cancels a running workflow by ID.
      tags:
      - workflows
      parameters:
      - name: id
        in: path
        description: workflow id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopWorkflowResponse'
        '400':
          description: missing id
          content: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: workflow not found
          content: *id001
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: internal error
          content: *id001
        '503':
          description: daemon unavailable
          content: *id001
      security:
      - bearerAuth: []
components:
  schemas:
    AttachSessionRequest:
      description: Which session to attach to.
      type: object
      properties:
        agent_id:
          type: string
      required:
      - agent_id
    AttachSessionResponse:
      description: A session's identity plus the transcript needed to resume following it.
      type: object
      properties:
        agent_id:
          type: string
        history:
          type: array
          items: {}
        instance_name:
          type: string
        name:
          type: string
        pending_response:
          type: string
        replay_events:
          type: array
          items: {}
        role:
          type: string
    CallToolRequest:
      description: Arguments for a direct tool invocation, bypassing the model.
      type: object
      properties:
        args:
          description: Tool arguments, shaped by that tool's own input schema.
        live_state:
          type: boolean
    CallToolResponse:
      description: The result of a direct tool invocation.
      type: object
      properties:
        duration_ms:
          type: integer
        output:
          type: string
        success:
          type: boolean
        tool_name:
          type: string
    ConversationInfo:
      description: 'One conversation in a listing. Role, plan mode and timestamps are absent: the daemon''s
        session roster does not carry them.'
      type: object
      properties:
        age_seconds:
          type: integer
        attached:
          type: boolean
        created_at:
          type: string
          format: date-time
        events_count:
          type: integer
        id:
          type: string
        name:
          type: string
        plan_mode:
          type: string
        protected:
          type: boolean
        role:
          type: string
        status:
          type: string
        updated_at:
          type: string
          format: date-time
    CreateConversationRequest:
      description: Options for a new conversation.
      type: object
      properties:
        interactive:
          type: boolean
    CreateConversationResponse:
      description: The conversation that was created.
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
        instance_name:
          type: string
        role:
          type: string
      required:
      - id
    DeleteConversationResponse:
      description: Confirmation that a conversation and its journal were removed.
      type: object
      properties:
        deleted_events:
          type: integer
        id:
          type: string
        message:
          type: string
    ErrorDetails:
      description: 'What went wrong: a stable code, a human-readable message, and any structured context.'
      type: object
      properties:
        code:
          type: string
          description: Stable, machine-readable error code
          enum:
          - invalid_request
          - unauthorized
          - forbidden
          - not_found
          - conflict
          - timeout
          - too_many_requests
          - server_error
          - not_implemented
          - service_unavailable
        details:
          type: object
          additionalProperties: {}
        message:
          type: string
      required:
      - code
      - message
    ErrorResponse:
      description: The error shape every failing request returns.
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetails'
      required:
      - error
    FailWorkflowResponse:
      description: Confirmation that a workflow was marked failed.
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        status:
          type: string
    GetContextResponse:
      description: A conversation's context breakdown as the context builder reports it.
      type: object
      properties:
        agent_id:
          type: string
        context:
          description: The context builder's breakdown, whose shape is the builder's to define.
    GetConversationResponse:
      description: One conversation's detail, including its context breakdown.
      type: object
      properties:
        context:
          type: object
          additionalProperties: {}
        created_at:
          type: string
          format: date-time
        events_count:
          type: integer
        id:
          type: string
        name:
          type: string
        plan_mode:
          type: string
        protected:
          type: boolean
        role:
          type: string
        status:
          type: string
        updated_at:
          type: string
          format: date-time
    GetDocsResponse:
      description: One documentation topic's Markdown source.
      type: object
      properties:
        content:
          type: string
        topic:
          type: string
      required:
      - topic
      - content
    GetGoalResponse:
      description: One goal's detail. Identical in shape to a goal in a listing.
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        description:
          type: string
        id:
          type: string
        parent_id:
          type: string
        parent_type:
          type: string
        status:
          type: string
        subtree:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time
    GetSpecResponse:
      description: One specification topic's Markdown source.
      type: object
      properties:
        content:
          type: string
        topic:
          type: string
      required:
      - topic
      - content
    GetToolResponse:
      description: One tool's detail. Capabilities and the input schema are absent unless the daemon reports
        them.
      type: object
      properties:
        capabilities:
          type: array
          items:
            type: string
        description:
          type: string
        generated:
          type: boolean
        input_schema:
          description: The tool's JSON Schema for its arguments, passed through as the tool declares it.
        kind:
          type: string
        loaded:
          type: boolean
        manifest_path:
          type: string
        name:
          type: string
        plugin:
          type: string
    GoalInfo:
      description: A goal as the daemon stores it. A goal carries no name, priority, owning session or
        progress note.
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        description:
          type: string
        id:
          type: string
        parent_id:
          type: string
        parent_type:
          type: string
        status:
          type: string
        subtree:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time
    HealthResponse:
      description: The API server's own health, and whether it can reach the daemon.
      type: object
      properties:
        daemon_connected:
          type: boolean
        status:
          type: string
        uptime_seconds:
          type: integer
        version:
          type: string
      required:
      - status
      - daemon_connected
      - version
    ListConversationsResponse:
      description: A page of conversations.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConversationInfo'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ListDocsResponse:
      description: The documentation topics this build embeds.
      type: object
      properties:
        topics:
          type: array
          items:
            type: string
      required:
      - topics
    ListGoalsResponse:
      description: A page of goals.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GoalInfo'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ListNotificationsResponse:
      description: A page of notifications.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ListPluginsResponse:
      description: A page of plugins.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PluginInfo'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ListSpecResponse:
      description: The specification topics this build embeds.
      type: object
      properties:
        topics:
          type: array
          items:
            type: string
      required:
      - topics
    ListToolsResponse:
      description: A page of tools.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ToolInfo'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ListWorkflowsResponse:
      description: A page of workflows.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowInfo'
        pagination:
          $ref: '#/components/schemas/Pagination'
    MemoryStats:
      description: Row counts from the daemon's store.
      type: object
      properties:
        events_count:
          type: integer
        memories_count:
          type: integer
        workflows_count:
          type: integer
    Notification:
      description: One entry of the human-facing feed. The store records no title, severity or type.
      type: object
      properties:
        agent_id:
          type: string
        created_at:
          type: string
          format: date-time
        id:
          type: string
        message:
          type: string
        seen:
          type: boolean
    Pagination:
      description: Which page a list response carries. Paging is offset based; there is no cursor.
      type: object
      properties:
        has_more:
          type: boolean
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      required:
      - limit
      - offset
      - total
      - has_more
    PluginInfo:
      description: One plugin's roster entry. Disabled distinguishes a plugin switched off by the operator
        from one that failed to load.
      type: object
      properties:
        disabled:
          type: boolean
        error:
          type: string
        loaded:
          type: boolean
        name:
          type: string
        source:
          description: builtin, user
          type: string
        tools:
          type: array
          items:
            type: string
    ReloadPluginsResponse:
      description: The plugin roster after a reload, with how many loaded and how many failed.
      type: object
      properties:
        failed_count:
          type: integer
        loaded_count:
          type: integer
        message:
          type: string
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/PluginInfo'
    CapabilityGrant:
      description: One capability in force for the generated-tool tier.
      type: object
      properties:
        capability:
          description: 'One of: fs.read, fs.write, net.http, env, state.'
          type: string
        created_at:
          type: string
        id:
          type: string
        params:
          description: The scope this grant confers, as JSON. Shape depends on the capability.
          type: string
        request_id:
          description: The request this grant came from, when its source is approved.
          type: string
        source:
          description: >-
            Where the grant came from: default (derived from the workspace root),
            config (nine.toml) or approved (an operator's decision). Only approved
            grants survive a boot independently of the file.
          type: string
      required:
      - id
      - source
      - capability
    CapabilityRequest:
      description: One request from the agent for a capability the ceiling does not permit.
      type: object
      properties:
        agent_id:
          type: string
        capability:
          type: string
        created_at:
          type: string
        decided_at:
          type: string
        id:
          type: string
        params:
          description: The scope requested, as JSON. Empty when the agent named none.
          type: string
        reason:
          description: Why the agent says it needs the capability. An operator reads this to decide.
          type: string
        status:
          description: 'One of: pending, approved, denied.'
          type: string
        tool_name:
          type: string
      required:
      - id
      - capability
      - status
    CapabilityDecisionRequest:
      description: A decision on one capability request or grant.
      type: object
      properties:
        action:
          description: approve or deny a request, or revoke a grant an approval conferred.
          type: string
          enum:
          - approve
          - deny
          - revoke
      required:
      - action
    CapabilityDecisionResponse:
      description: What the decision did.
      type: object
      properties:
        message:
          description: A human-readable description of the outcome, including whether it took effect without a restart.
          type: string
      required:
      - message
    ListCapabilitiesResponse:
      description: The capability ceiling in force, and the requests to widen it.
      type: object
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityGrant'
        requests:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityRequest'
    ReloadToolsResponse:
      description: The sandboxed-tool roster after a reload.
      type: object
      properties:
        message:
          type: string
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolInfo'
    SendMessageRequest:
      description: A user message to run as a turn.
      type: object
      properties:
        force_think:
          type: boolean
        text:
          type: string
      required:
      - text
    SendMessageResponse:
      description: The agent's reply to a turn.
      type: object
      properties:
        agent_id:
          type: string
        completed_at:
          type: string
          format: date-time
        text:
          type: string
        turn_id:
          type: string
    StatusResponse:
      description: 'The daemon''s status: uptime, active sessions and the plugin roster.'
      type: object
      properties:
        active_sessions:
          type: integer
        config:
          type: object
          additionalProperties: true
        memory:
          $ref: '#/components/schemas/MemoryStats'
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/PluginInfo'
        status:
          type: string
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolInfo'
        uptime:
          type: string
        version:
          type: string
    StopConversationResponse:
      description: Confirmation that a conversation was stopped, its history kept.
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        status:
          type: string
    StopWorkflowResponse:
      description: Confirmation that a workflow was cancelled.
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        status:
          type: string
    StreamConnected:
      description: The stream handshake, sent once when a client attaches.
      type: object
      required:
      - message
      - agent_id
      properties:
        message:
          type: string
        agent_id:
          type: string
    StreamDone:
      description: The turn finished; no further events follow for it.
      type: object
      required:
      - agent_id
      - timestamp
      properties:
        agent_id:
          type: string
        timestamp:
          type: integer
          format: int64
    StreamEvent:
      description: One server-sent event. The SSE event name (connected, tool_start, tool_end, response_chunk,
        done, error) selects the member.
      oneOf:
      - $ref: '#/components/schemas/StreamConnected'
      - $ref: '#/components/schemas/StreamToolStart'
      - $ref: '#/components/schemas/StreamToolEnd'
      - $ref: '#/components/schemas/StreamResponseChunk'
      - $ref: '#/components/schemas/StreamDone'
      - $ref: '#/components/schemas/ErrorResponse'
    StreamResponseChunk:
      description: A fragment of the agent's reply as it is produced.
      type: object
      required:
      - text
      - timestamp
      properties:
        text:
          type: string
        timestamp:
          type: integer
          format: int64
    StreamToolEnd:
      description: A tool call finished, with its output.
      type: object
      required:
      - tool_name
      - timestamp
      properties:
        tool_name:
          type: string
        tool_output:
          type: string
        timestamp:
          type: integer
          format: int64
    StreamToolStart:
      description: A tool call began, with the arguments it was given.
      type: object
      required:
      - tool_name
      - timestamp
      properties:
        tool_name:
          type: string
        tool_input:
          description: Tool arguments, shaped by that tool's own input schema.
        timestamp:
          type: integer
          format: int64
    ToolInfo:
      description: One tool in a listing, with where it came from and whether it loaded.
      type: object
      properties:
        capabilities:
          type: array
          items:
            type: string
        description:
          type: string
        error:
          type: string
        generated:
          type: boolean
        input_schema:
          description: The tool's JSON Schema for its arguments, passed through as the tool declares it.
        kind:
          description: plugin, sandboxed, generated
          type: string
        loaded:
          type: boolean
        manifest_path:
          type: string
        name:
          type: string
        plugin:
          type: string
    WorkflowInfo:
      description: A workflow as the daemon stores it. Steps and completed_steps summarise the stored
        step list; the store records no current step.
      type: object
      properties:
        agent_id:
          type: string
        completed_steps:
          type: integer
        created_at:
          type: string
          format: date-time
        id:
          type: string
        name:
          type: string
        status:
          description: active, done, failed, cancelled
          type: string
        steps:
          type: integer
        updated_at:
          type: string
          format: date-time
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content: &id002
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until a retry may succeed
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content: *id002
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token authentication. Required only when the server is configured with an auth_token;
        the API is open otherwise.
security:
- bearerAuth: []
