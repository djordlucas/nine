components:
  schemas:
    AuthSessionResponse:
      description: The browser session as this request sees it.
      type: object
      properties:
        auth_required:
          description: the server has an auth_token; without one every request is accepted
          type: boolean
        authenticated:
          description: this request carries a valid session cookie or bearer token
          type: boolean
        csrf_token:
          description: sent as X-Nine-CSRF on cookie-authenticated writes; present only for a cookie session
          type: string
      required:
      - auth_required
      - authenticated
    AttachSessionRequest:
      description: Which session to attach to.
      type: object
      properties:
        agent_id:
          type: string
      required:
      - agent_id
    AttachSessionResponse:
      description: A session's identity plus the transcript needed to resume following it.
      type: object
      properties:
        agent_id:
          type: string
        history:
          type: array
          items: {}
        instance_name:
          type: string
        name:
          type: string
        pending_response:
          type: string
        replay_events:
          type: array
          items: {}
        role:
          type: string
    CreateAuthSessionRequest:
      description: The API token, as configured in auth_token.
      type: object
      properties:
        token:
          type: string
      required:
      - token
    CallToolRequest:
      description: Arguments for a direct tool invocation, bypassing the model.
      type: object
      properties:
        args:
          description: Tool arguments, shaped by that tool's own input schema.
        live_state:
          type: boolean
    CallToolResponse:
      description: The result of a direct tool invocation.
      type: object
      properties:
        duration_ms:
          type: integer
        output:
          type: string
        success:
          type: boolean
        tool_name:
          type: string
    ConversationHistoryResponse:
      description: A page of a conversation's transcript.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEntry'
        pagination:
          $ref: '#/components/schemas/Pagination'
    HistoryEntry:
      description: One transcript entry. Which fields are set depends on type.
      type: object
      required:
      - type
      - agent_id
      properties:
        type:
          type: string
          enum:
          - user_turn
          - response
          - tool_start
          - tool_end
          - sub_agent_start
          - sub_agent_end
          - turn_error
        agent_id:
          type: string
        text:
          description: 'user_turn: the prompt. response: the reply. turn_error: why a turn ended without
            a reply, failed or cancelled. sub_agent_*: the sub-agent''s task.'
          type: string
        tool_name:
          type: string
        tool_input:
          description: Tool arguments, shaped by that tool's own input schema.
        tool_output:
          type: string
        sub_agent_id:
          type: string
        role:
          type: string
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        turn_number:
          type: integer
    ConfigResponse:
      description: The configuration the daemon runs with, credentials hidden.
      type: object
      required:
      - toml
      properties:
        toml:
          type: string
          description: The settings that are set, as TOML.
    ConversationInfo:
      description: 'One conversation in a listing. Role, plan mode and timestamps are absent: the daemon''s
        session roster does not carry them.'
      type: object
      properties:
        age_seconds:
          type: integer
        attached:
          type: boolean
        created_at:
          type: string
          format: date-time
        events_count:
          type: integer
        id:
          type: string
        name:
          type: string
        plan_mode:
          type: string
        protected:
          type: boolean
        role:
          type: string
        status:
          type: string
        updated_at:
          type: string
          format: date-time
    CreateGoalRequest:
      description: A goal to create.
      type: object
      properties:
        description:
          description: What the goal is.
          type: string
          minLength: 1
        parent_id:
          description: A goal to create this one under. Omit for a top-level goal, which gets its own session.
          type: string
      required:
      - description
    CreateGoalResponse:
      description: The goal created, and what happened to its background session.
      type: object
      properties:
        goal:
          $ref: '#/components/schemas/GoalInfo'
        pursue_session:
          description: 'spawned: a session now pursues the goal. limit_reached: the daemon is at its goal-session
            cap, so the goal is recorded but unattended. none: a sub-goal, which gets no session.'
          type: string
          enum:
          - spawned
          - limit_reached
          - none
        session_id:
          description: The pursuing session's conversation id — the goal's own id. Absent for a sub-goal.
          type: string
      required:
      - goal
      - pursue_session
    CreateConversationRequest:
      description: Options for a new conversation.
      type: object
      properties:
        interactive:
          type: boolean
    CreateConversationResponse:
      description: The conversation that was created.
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
        instance_name:
          type: string
        role:
          type: string
      required:
      - id
    DeleteConversationResponse:
      description: Confirmation that a conversation and its journal were removed.
      type: object
      properties:
        deleted_events:
          type: integer
        id:
          type: string
        message:
          type: string
    DeleteGoalResponse:
      description: Which goals were deleted, and whether a running session was stopped.
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        deleted:
          description: Every goal id removed — the goal itself first, then its sub-goals.
          type: array
          items:
            type: string
        session_stopped:
          type: boolean
      required:
      - id
      - deleted
      - session_stopped
    ErrorDetails:
      description: 'What went wrong: a stable code, a human-readable message, and any structured context.'
      type: object
      properties:
        code:
          type: string
          description: Stable, machine-readable error code
          enum:
          - invalid_request
          - unauthorized
          - forbidden
          - not_found
          - conflict
          - timeout
          - too_many_requests
          - server_error
          - not_implemented
          - service_unavailable
        details:
          type: object
          additionalProperties: {}
        message:
          type: string
      required:
      - code
      - message
    EventsConnected:
      description: The stream handshake. seq is the position the stream starts after.
      type: object
      required:
      - seq
      properties:
        seq:
          type: integer
          format: int64
    EventsReset:
      description: The requested position could not be honoured; the stream continues from seq. A client
        reloads what it shows.
      type: object
      required:
      - seq
      properties:
        seq:
          type: integer
          format: int64
    EventsStreamEvent:
      description: One server-sent event on /events. The SSE event name (connected, journal, reset, error)
        selects the member.
      oneOf:
      - $ref: '#/components/schemas/EventsConnected'
      - $ref: '#/components/schemas/JournalEvent'
      - $ref: '#/components/schemas/EventsReset'
      - $ref: '#/components/schemas/ErrorResponse'
    WorkspaceEntry:
      description: One file or directory of the workspace.
      type: object
      required:
      - name
      - path
      - bytes
      - modified
      properties:
        name:
          type: string
        path:
          description: relative to the workspace root
          type: string
        dir:
          type: boolean
        bytes:
          type: integer
          format: int64
        modified:
          type: string
          format: date-time
        version:
          description: a file's version, which changes whenever it does; the ETag and If-Match value
          type: string
        trashed:
          description: the trash entry an overwrite or delete moved the old file to
          type: string
    WorkspaceListing:
      description: One directory of the workspace.
      type: object
      required:
      - path
      - entries
      properties:
        path:
          description: the directory, relative to the root; empty for the root
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceEntry'
    DatabaseColumn:
      description: One column of a table.
      type: object
      required:
      - name
      - type
      - not_null
      - pk
      properties:
        name:
          type: string
        type:
          description: the declared type; empty when none was declared
          type: string
        not_null:
          type: boolean
        default:
          description: the default, as SQL
          type: string
        pk:
          description: its position in the primary key, from 1; 0 when not part of it
          type: integer
    DatabaseTable:
      description: One table or view of the database.
      type: object
      required:
      - name
      - kind
      - columns
      - rows
      - rowid
      properties:
        name:
          type: string
        kind:
          type: string
          enum:
          - table
          - view
          - virtual
        columns:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseColumn'
        rows:
          type: integer
          format: int64
        rowid:
          description: rows are addressed by rowid, so they can be changed one at a time
          type: boolean
    ListDatabaseTablesResponse:
      description: The database's tables.
      type: object
      required:
      - tables
      properties:
        tables:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseTable'
    DatabaseRows:
      description: A page of a table's rows.
      type: object
      required:
      - table
      - columns
      - rows
      - total
      - offset
      properties:
        table:
          type: string
        columns:
          type: array
          items:
            type: string
        rowids:
          description: each row's rowid, in step with rows; absent for a table without one
          type: array
          items:
            type: integer
            format: int64
        rows:
          type: array
          items:
            type: array
            items: {}
        total:
          type: integer
          format: int64
        offset:
          type: integer
    DatabaseRowValues:
      description: Column values for a row.
      type: object
      required:
      - values
      properties:
        values:
          description: column name to value; a string is stored with the column's type affinity, null as NULL
          type: object
          additionalProperties: {}
    RunDatabaseSQLRequest:
      description: One statement and its parameters.
      type: object
      required:
      - sql
      properties:
        sql:
          type: string
          minLength: 1
        args:
          description: values for the ? parameters, in order
          type: array
          items: {}
    DatabaseRunResult:
      description: What a statement did. A read has columns and rows; a write has changes.
      type: object
      required:
      - columns
      - rows
      - write
      - changes
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items: {}
        truncated:
          description: the read returned more rows than the 1000 shown
          type: boolean
        write:
          type: boolean
        changes:
          type: integer
          format: int64
        last_insert_rowid:
          type: integer
          format: int64
    ErrorResponse:
      description: The error shape every failing request returns.
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetails'
      required:
      - error
    FailWorkflowResponse:
      description: Confirmation that a workflow was marked failed.
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        status:
          type: string
    GetContextResponse:
      description: A conversation's context breakdown as the context builder reports it.
      type: object
      properties:
        agent_id:
          type: string
        context:
          description: The context builder's breakdown, whose shape is the builder's to define.
    GetConversationResponse:
      description: One conversation's detail, including its context breakdown.
      type: object
      properties:
        context:
          type: object
          additionalProperties: {}
        created_at:
          type: string
          format: date-time
        events_count:
          type: integer
        id:
          type: string
        name:
          type: string
        plan_mode:
          type: string
        protected:
          type: boolean
        role:
          type: string
        status:
          type: string
        updated_at:
          type: string
          format: date-time
    GetDocsResponse:
      description: One documentation topic's Markdown source.
      type: object
      properties:
        content:
          type: string
        topic:
          type: string
      required:
      - topic
      - content
    GetGoalResponse:
      description: One goal's detail. Identical in shape to a goal in a listing.
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        description:
          type: string
        id:
          type: string
        parent_id:
          type: string
        parent_type:
          type: string
        status:
          type: string
        subtree:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time
    GetSpecResponse:
      description: One specification topic's Markdown source.
      type: object
      properties:
        content:
          type: string
        topic:
          type: string
      required:
      - topic
      - content
    DeleteToolResponse:
      type: object
      description: The outcome of deleting a tool Nine wrote.
      required:
      - name
      - message
      properties:
        name:
          type: string
          description: the deleted tool
        message:
          type: string
          description: the daemon's outcome
    ToolVersionsResponse:
      type: object
      description: A tool Nine wrote and the versions it keeps.
      required:
      - name
      - version
      - previous
      properties:
        name:
          type: string
          description: the tool
        version:
          type: integer
          description: its current version
        probation:
          type: boolean
          description: the current version has not yet run, and is rolled back if it fails first
        written_by:
          type: string
          description: the session that wrote the current version, "operator" or "rollback"
        updated_at:
          type: string
          description: when the current version was written
        previous:
          type: array
          description: the kept previous versions, newest first
          items:
            $ref: '#/components/schemas/ToolVersion'
    ToolVersion:
      type: object
      description: One kept version of a tool.
      required:
      - version
      - written_at
      properties:
        version:
          type: integer
          description: its number
        written_by:
          type: string
          description: who wrote it
        written_at:
          type: string
          description: when it was written
        lines:
          type: integer
          description: the size of its source, in lines
    RestoreToolResponse:
      type: object
      description: The outcome of restoring a version.
      required:
      - name
      - message
      properties:
        name:
          type: string
          description: the tool
        message:
          type: string
          description: the daemon's outcome
    GetToolResponse:
      description: One tool's detail. Capabilities and the input schema are absent unless the daemon reports
        them.
      type: object
      properties:
        capabilities:
          type: array
          items:
            type: string
        description:
          type: string
        generated:
          type: boolean
        input_schema:
          description: The tool's JSON Schema for its arguments, passed through as the tool declares it.
        kind:
          description: 'core: built into Nine. plugin: served by a plugin. sandboxed: an installed sandboxed
            tool. generated: one Nine wrote.'
          type: string
        loaded:
          type: boolean
        manifest_path:
          type: string
        deps:
          description: the npm packages a generated tool's bundle carries, as name@version
          type: array
          items:
            type: string
        timeout:
          description: this tool's per-call deadline when [tool.<name>] timeout overrides [tools] timeout
          type: string
        name:
          type: string
        plugin:
          type: string
    GoalInfo:
      description: A goal as the daemon stores it. A goal carries no name, priority, owning session or
        progress note.
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        description:
          type: string
        id:
          type: string
        parent_id:
          type: string
        parent_type:
          type: string
        status:
          type: string
        subtree:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time
    SetGoalStatusRequest:
      description: A goal's new status.
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - active
          - paused
          - done
          - archived
          description: active is in progress, paused is on hold, done is attained, archived is retired
            without completion.
    ListReflectionsResponse:
      description: A reflecting session's conclusions, oldest first.
      type: object
      required:
      - agent
      - data
      properties:
        agent:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Reflection'
    Reflection:
      description: What one reflection turn concluded.
      type: object
      required:
      - at
      - text
      properties:
        at:
          type: string
          format: date-time
        turn:
          type: integer
        text:
          type: string
    ListSessionsResponse:
      description: A page of the session roster.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionInfo'
        pagination:
          $ref: '#/components/schemas/Pagination'
    SessionInfo:
      description: One session of the roster.
      type: object
      required:
      - id
      - status
      - age_seconds
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        age_seconds:
          description: seconds since it was last active
          type: integer
        events:
          description: the journal events it holds
          type: integer
        protected:
          description: kept by retention, because it has an active goal or session plan
          type: boolean
        attached:
          description: a client is attached to it now
          type: boolean
    DeleteSessionResponse:
      description: What deleting a session removed.
      type: object
      required:
      - id
      - message
      properties:
        id:
          type: string
        message:
          description: the counts removed, by kind
          type: string
    HealthResponse:
      description: The API server's own health, and whether it can reach the daemon.
      type: object
      properties:
        daemon_connected:
          type: boolean
        status:
          type: string
        uptime_seconds:
          type: integer
        version:
          type: string
      required:
      - status
      - daemon_connected
      - version
    ListConversationsResponse:
      description: A page of conversations.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConversationInfo'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ListDocsResponse:
      description: The documentation topics this build embeds.
      type: object
      properties:
        topics:
          type: array
          items:
            type: string
      required:
      - topics
    ListGoalsResponse:
      description: A page of goals.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GoalInfo'
        pagination:
          $ref: '#/components/schemas/Pagination'
    JournalEvent:
      description: One journal event (spec/contracts/event-journal.md), from any session or process.
      type: object
      required:
      - seq
      - agent_id
      - turn
      - type
      - timestamp
      properties:
        seq:
          type: integer
          format: int64
        agent_id:
          description: The session, process or goal the event belongs to; daemon for a change no session
            made.
          type: string
        turn:
          description: The turn it belongs to; 0 for an event outside any turn.
          type: integer
        type:
          description: A session event (turn_start, tool_end, ...), a process transition (process_*, standing_*),
            or a state change (human_input_*, capability_*, notification, goal_*, workflow_*).
          type: string
        span_id:
          type: string
        parent_span_id:
          type: string
        timestamp:
          type: string
          format: date-time
        payload:
          description: 'The event''s body, whose shape depends on type, or {"omitted": true, "bytes": N}
            for one over 16 KB.'
    ListNotificationsResponse:
      description: A page of notifications.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ListPluginsResponse:
      description: A page of plugins.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PluginInfo'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ListQuestionsResponse:
      description: The pending questions.
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Question'
    ListSkillsResponse:
      description: A page of skills.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SkillInfo'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ListSpecResponse:
      description: The specification topics this build embeds.
      type: object
      properties:
        topics:
          type: array
          items:
            type: string
      required:
      - topics
    ListToolsResponse:
      description: A page of tools.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ToolInfo'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ListWorkflowsResponse:
      description: A page of workflows.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowInfo'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ListProcessesResponse:
      description: A page of processes.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProcessInfo'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ProcessInfo:
      description: One process (docs/processes.md). recent is filled by getProcess only.
      type: object
      required:
      - id
      - tool
      - mode
      - state
      - trigger
      - budget
      properties:
        id:
          type: string
        tool:
          type: string
          description: the sandboxed tool that drives it
        mode:
          type: string
          enum:
          - live
          - slice
        state:
          type: string
          enum:
          - running
          - stopped
          - failing
        stopped_by:
          type: string
          description: who stopped it — operator, model, goal, budget, self — which decides who may start it again
        stopped_at:
          type: string
          format: date-time
        trigger:
          type: string
          description: its clock, e.g. "every 5m0s" or "cron 0 9 * * 1-5"; "—" for none
        session:
          type: string
          description: the session a live process drives
        attached:
          type: boolean
          description: true when it runs in another process's session
        goal:
          type: string
          description: the goal it is bound to
        report_to:
          type: string
          description: the process its reports are piped to
        role:
          type: string
        budget:
          $ref: '#/components/schemas/ProcessBudget'
        calls:
          type: integer
        cycles:
          type: integer
        failures:
          type: integer
          description: consecutive failures
        last_error:
          type: string
        last_call_at:
          type: string
          format: date-time
        next_at:
          type: string
          format: date-time
        generated:
          type: boolean
          description: written by Nine
        recent:
          type: array
          items:
            $ref: '#/components/schemas/ProcessActivity'
    ProcessBudget:
      description: A process's budget over a rolling day and what the day has used.
      type: object
      required:
      - turns
      - turns_per_day
      - tokens
      - tokens_per_day
      properties:
        turns:
          type: integer
        turns_per_day:
          type: integer
        tokens:
          type: integer
        tokens_per_day:
          type: integer
        resets_at:
          type: string
          format: date-time
          description: when the current day ends; absent when none is under way
    ProcessActivity:
      description: One line of a process's recent activity.
      type: object
      required:
      - at
      - outcome
      properties:
        at:
          type: string
          format: date-time
        outcome:
          type: string
        detail:
          type: string
    ProcessActionResponse:
      description: The outcome of starting, stopping or messaging a process.
      type: object
      required:
      - id
      - message
      properties:
        id:
          type: string
        message:
          type: string
          description: the daemon's outcome
    SendProcessMessageRequest:
      description: A message for a live process, which it receives as its next trigger.
      type: object
      required:
      - text
      properties:
        text:
          type: string
          minLength: 1
    MemoryStats:
      description: Row counts from the daemon's store.
      type: object
      properties:
        events_count:
          type: integer
        memories_count:
          type: integer
        workflows_count:
          type: integer
    Notification:
      description: One entry of the human-facing feed. The store records no title, severity or type.
      type: object
      properties:
        agent_id:
          type: string
        created_at:
          type: string
          format: date-time
        id:
          type: string
        message:
          type: string
        seen:
          type: boolean
    Pagination:
      description: Which page a list response carries. Paging is offset based; there is no cursor.
      type: object
      properties:
        has_more:
          type: boolean
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      required:
      - limit
      - offset
      - total
      - has_more
    PluginInfo:
      description: One plugin's roster entry. Disabled distinguishes a plugin switched off by the operator
        from one that failed to load.
      type: object
      properties:
        disabled:
          type: boolean
        error:
          type: string
        loaded:
          type: boolean
        name:
          type: string
        source:
          description: builtin, user
          type: string
        tools:
          type: array
          items:
            type: string
    ReloadPluginsResponse:
      description: The plugin roster after a reload, with how many loaded and how many failed.
      type: object
      properties:
        failed_count:
          type: integer
        loaded_count:
          type: integer
        message:
          type: string
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/PluginInfo'
    CapabilityGrant:
      description: One capability in force for the generated-tool tier.
      type: object
      properties:
        capability:
          description: 'One of: fs.read, fs.write, net.http, env, state, sql.'
          type: string
        created_at:
          type: string
        id:
          type: string
        params:
          description: The scope this grant confers, as JSON. Shape depends on the capability.
          type: string
        request_id:
          description: The request this grant came from, when its source is approved.
          type: string
        source:
          description: >-
            Where the grant came from: default (derived from the workspace root),
            config (nine.toml) or approved (an operator's decision). Only approved
            grants survive a boot independently of the file.
          type: string
      required:
      - id
      - source
      - capability
    CapabilityRequest:
      description: One request from the agent for a capability the ceiling does not permit.
      type: object
      properties:
        agent_id:
          type: string
        capability:
          type: string
        created_at:
          type: string
        decided_at:
          type: string
        id:
          type: string
        params:
          description: The scope requested, as JSON. Empty when the agent named none.
          type: string
        reason:
          description: Why the agent says it needs the capability. An operator reads this to decide.
          type: string
        status:
          description: 'One of: pending, approved, denied.'
          type: string
        tool_name:
          type: string
      required:
      - id
      - capability
      - status
    CapabilityDecisionRequest:
      description: A decision on one capability request or grant.
      type: object
      properties:
        action:
          description: approve or deny a request, or revoke a grant an approval conferred.
          type: string
          enum:
          - approve
          - deny
          - revoke
      required:
      - action
    CapabilityDecisionResponse:
      description: What the decision did.
      type: object
      properties:
        message:
          description: A human-readable description of the outcome, including whether it took effect without a restart.
          type: string
      required:
      - message
    ListCapabilitiesResponse:
      description: The capability ceiling in force, and the requests to widen it.
      type: object
      properties:
        grants:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityGrant'
        requests:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityRequest'
    ReloadToolsResponse:
      description: The sandboxed-tool roster after a reload.
      type: object
      properties:
        message:
          type: string
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolInfo'
    ReplayTurnRequest:
      description: The turn to reconstruct.
      type: object
      properties:
        turn:
          description: 1-based turn number, as trace reports it.
          type: integer
          minimum: 1
      required:
      - turn
    ReplayTurnResponse:
      description: One turn reconstructed from the journal, in the order it ran.
      type: object
      properties:
        agent_id:
          type: string
        turn:
          type: integer
        trigger:
          description: What started the turn — user, or idle for a scheduled wake.
          type: string
        input:
          type: string
        llm_calls:
          type: array
          items:
            $ref: '#/components/schemas/ReplayLLMCall'
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ReplayToolCall'
        sub_agents:
          type: array
          items:
            $ref: '#/components/schemas/ReplaySubAgent'
        result:
          $ref: '#/components/schemas/ReplayResult'
      required:
      - agent_id
      - turn
      - llm_calls
      - tool_calls
      - sub_agents
    ReplayLLMCall:
      description: One inner LLM call — the request as the context builder assembled it, and the model's reply.
      type: object
      properties:
        n:
          description: 1-based call number within the turn.
          type: integer
        system:
          type: string
        message_count:
          type: integer
        tool_names:
          type: array
          items:
            type: string
        tokens_used:
          description: The context builder's estimate for the request.
          type: integer
        budget:
          type: integer
        input_tokens:
          description: Provider-reported input tokens, when the provider reports them.
          type: integer
        output_tokens:
          type: integer
        stop_reason:
          type: string
        text:
          type: string
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ReplayRequestedTool'
      required:
      - n
    ReplayRequestedTool:
      description: A tool call the model asked for.
      type: object
      properties:
        name:
          type: string
        input:
          description: Tool arguments, shaped by that tool's own input schema.
      required:
      - name
    ReplayToolCall:
      description: A tool call as it ran, with its I/O and any outbound HTTP a sandboxed tool made.
      type: object
      properties:
        name:
          type: string
        input:
          description: Tool arguments, shaped by that tool's own input schema.
        output:
          type: string
        error:
          type: string
        duration_ms:
          type: integer
          format: int64
        attempts:
          type: integer
        truncated:
          type: boolean
        output_chars:
          description: The full output's length, when it was over the cap.
          type: integer
        spill_path:
          description: Where the full output was written, when it was over the cap.
          type: string
        http:
          type: array
          items:
            $ref: '#/components/schemas/ReplayHTTPRequest'
      required:
      - name
    ReplayHTTPRequest:
      description: One outbound request a sandboxed tool made. Error is the refusal reason for a blocked request.
      type: object
      properties:
        method:
          type: string
        url:
          type: string
        host:
          type: string
        status:
          type: integer
        bytes:
          type: integer
        truncated:
          type: boolean
        duration_ms:
          type: integer
          format: int64
        error:
          type: string
    ReplaySubAgent:
      description: A sub-agent spawned during the turn.
      type: object
      properties:
        id:
          type: string
        task:
          type: string
        role:
          type: string
        status:
          description: done, failed or timed_out; empty if it had not finished when the turn ended.
          type: string
      required:
      - id
    ReplayResult:
      description: How the turn ended.
      type: object
      properties:
        text:
          type: string
        error:
          type: string
        tool_count:
          type: integer
        duration_ms:
          type: integer
          format: int64
    SendMessageRequest:
      description: A user message to run as a turn.
      type: object
      properties:
        force_think:
          type: boolean
        text:
          type: string
      required:
      - text
    SendMessageResponse:
      description: The agent's reply to a turn.
      type: object
      properties:
        agent_id:
          type: string
        completed_at:
          type: string
          format: date-time
        text:
          type: string
        turn_id:
          type: string
    StatusResponse:
      description: 'The daemon''s status: uptime, active sessions and the plugin roster.'
      type: object
      properties:
        active_sessions:
          type: integer
        max_running:
          type: integer
          description: '[processes] max_running: how many processes may run at once.'
        config:
          type: object
          additionalProperties: true
        memory:
          $ref: '#/components/schemas/MemoryStats'
        model:
          type: string
          description: The model the daemon calls, as [llm] model or NINE_LLM_MODEL names it.
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/PluginInfo'
        provider:
          type: string
          description: The LLM provider the daemon calls, ollama or mistral.
        status:
          type: string
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolInfo'
        uptime:
          type: string
        version:
          type: string
    RenameConversationRequest:
      description: A conversation's new display name.
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: One line; surrounding spaces are trimmed.
    RenameConversationResponse:
      description: The conversation and the name it now has.
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
    SkillInfo:
      description: One skill in the catalog.
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        source:
          description: 'builtin: seeded from the binary. user: seeded from [skills].user_dir. agent: written by
            Nine itself.'
          type: string
          enum:
          - builtin
          - user
          - agent
      required:
      - name
      - source
    SkillDetail:
      description: One skill with its body.
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        source:
          description: 'builtin: seeded from the binary. user: seeded from [skills].user_dir. agent: written by
            Nine itself.'
          type: string
          enum:
          - builtin
          - user
          - agent
        content:
          description: the skill's body, in Markdown
          type: string
      required:
      - name
      - source
      - content
    CancelTurnResponse:
      description: Whether a running turn was cancelled.
      type: object
      required:
      - id
      - cancelled
      properties:
        id:
          type: string
        cancelled:
          description: false when the conversation was not running a turn.
          type: boolean
    StopConversationResponse:
      description: Confirmation that a conversation was stopped, its history kept.
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        status:
          type: string
    StopWorkflowResponse:
      description: Confirmation that a workflow was cancelled.
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        status:
          type: string
    StreamConnected:
      description: The stream handshake, sent once when a client attaches.
      type: object
      required:
      - message
      - agent_id
      properties:
        message:
          type: string
        agent_id:
          type: string
    StreamDone:
      description: The turn finished; no further events follow for it.
      type: object
      required:
      - agent_id
      - timestamp
      properties:
        agent_id:
          type: string
        timestamp:
          type: integer
          format: int64
    Question:
      description: An ask_human question waiting for an answer.
      type: object
      required:
      - id
      - agent_id
      - question
      - created_at
      - expires_at
      properties:
        id:
          type: string
        agent_id:
          description: The conversation that asked.
          type: string
        question:
          type: string
        options:
          type: array
          items:
            type: string
        created_at:
          type: string
        expires_at:
          type: string
          format: date-time
    StreamEvent:
      description: One server-sent event. The SSE event name (connected, tool_start, tool_end, response_chunk,
        response, sub_agent_start, sub_agent_end, notice, done, error) selects the member.
      oneOf:
      - $ref: '#/components/schemas/StreamConnected'
      - $ref: '#/components/schemas/StreamToolStart'
      - $ref: '#/components/schemas/StreamToolEnd'
      - $ref: '#/components/schemas/StreamResponseChunk'
      - $ref: '#/components/schemas/StreamResponse'
      - $ref: '#/components/schemas/StreamSubAgent'
      - $ref: '#/components/schemas/StreamNotice'
      - $ref: '#/components/schemas/StreamDone'
      - $ref: '#/components/schemas/ErrorResponse'
    StreamResponse:
      description: A turn's final reply. Sent whether or not the reply was also streamed as chunks.
      type: object
      required:
      - agent_id
      - text
      - timestamp
      properties:
        agent_id:
          type: string
        text:
          type: string
        timestamp:
          type: integer
          format: int64
    StreamSubAgent:
      description: A sub-agent was spawned (sub_agent_start) or finished (sub_agent_end, with status).
      type: object
      required:
      - sub_agent_id
      - timestamp
      properties:
        sub_agent_id:
          type: string
        task:
          type: string
        role:
          type: string
        status:
          description: 'sub_agent_end only: done, failed or timed_out.'
          type: string
        timestamp:
          type: integer
          format: int64
    StreamNotice:
      description: An informational, session-level notice, such as a capability downgrade.
      type: object
      required:
      - text
      - timestamp
      properties:
        text:
          type: string
        timestamp:
          type: integer
          format: int64
    StreamResponseChunk:
      description: A fragment of the agent's reply as it is produced.
      type: object
      required:
      - text
      - timestamp
      properties:
        text:
          type: string
        timestamp:
          type: integer
          format: int64
    StreamToolEnd:
      description: A tool call finished, with its output.
      type: object
      required:
      - tool_name
      - timestamp
      properties:
        tool_name:
          type: string
        tool_output:
          type: string
        timestamp:
          type: integer
          format: int64
    StreamToolStart:
      description: A tool call began, with the arguments it was given.
      type: object
      required:
      - tool_name
      - timestamp
      properties:
        tool_name:
          type: string
        tool_input:
          description: Tool arguments, shaped by that tool's own input schema.
        timestamp:
          type: integer
          format: int64
    TraceResponse:
      description: A session's journal, oldest first.
      type: object
      properties:
        agent_id:
          type: string
        turns:
          description: How many distinct turns the events span. Turn 0 is not counted; it holds events journaled
            outside any turn, such as supervisor events.
          type: integer
        events:
          type: array
          items:
            $ref: '#/components/schemas/TraceEvent'
        sub_agents:
          description: 'sub_agents=true only: every sub-agent spawned in events, and in their events in turn,
            in the order they were spawned.'
          type: array
          items:
            $ref: '#/components/schemas/TraceSubAgent'
      required:
      - agent_id
      - turns
      - events
    TraceEvent:
      description: One journal event (spec/contracts/event-journal.md). Payload is the type-specific body as
        journaled.
      type: object
      properties:
        seq:
          type: integer
          format: int64
        turn:
          type: integer
        type:
          description: turn_start, llm_request, llm_response, tool_start, tool_end, tool_http, context_update,
            thinking, sub_agent_start, sub_agent_end, turn_end, or supervisor (turn 0, outside any turn).
          type: string
        span_id:
          type: string
        parent_span_id:
          type: string
        timestamp:
          type: string
          format: date-time
        payload:
          description: The event's body, whose shape depends on type.
      required:
      - seq
      - turn
      - type
    TraceSubAgent:
      description: A spawned sub-agent's own trace, or why it could not be read.
      type: object
      properties:
        agent_id:
          type: string
        parent_agent_id:
          description: The session or sub-agent whose journal recorded the spawn.
          type: string
        spawned_at_seq:
          description: The seq of the sub_agent_start event, in the parent's events, that spawned it.
          type: integer
          format: int64
        events:
          type: array
          items:
            $ref: '#/components/schemas/TraceEvent'
        error:
          type: string
      required:
      - agent_id
      - parent_agent_id
      - spawned_at_seq
    ToolInfo:
      description: One tool in a listing, with where it came from and whether it loaded.
      type: object
      properties:
        capabilities:
          type: array
          items:
            type: string
        description:
          type: string
        error:
          type: string
        generated:
          type: boolean
        input_schema:
          description: The tool's JSON Schema for its arguments, passed through as the tool declares it.
        kind:
          description: 'core: built into Nine. plugin: served by a plugin. sandboxed: an installed sandboxed
            tool. generated: one Nine wrote.'
          type: string
        loaded:
          type: boolean
        manifest_path:
          type: string
        deps:
          description: the npm packages a generated tool's bundle carries, as name@version
          type: array
          items:
            type: string
        timeout:
          description: this tool's per-call deadline when [tool.<name>] timeout overrides [tools] timeout
          type: string
        name:
          type: string
        plugin:
          type: string
    WorkflowInfo:
      description: A workflow as the daemon stores it. Steps and completed_steps summarise the stored
        step list; the store records no current step.
      type: object
      properties:
        agent_id:
          type: string
        completed_steps:
          type: integer
        created_at:
          type: string
          format: date-time
        id:
          type: string
        name:
          type: string
        status:
          description: active, done, failed, cancelled
          type: string
        steps:
          type: integer
        updated_at:
          type: string
          format: date-time
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content: &id002
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until a retry may succeed
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content: *id002
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: nine_session
      description: The session cookie POST /auth/session sets. A write authenticated by it must also send
        X-Nine-CSRF and come from the server's own origin.
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token authentication. Required only when the server is configured with an auth_token;
        the API is open otherwise.
security:
- bearerAuth: []
- cookieAuth: []
