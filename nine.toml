# The shape of this file, not the version of Nine that wrote it. Absent means 1.
# A file declaring a schema newer than the binary understands stops the daemon
# rather than being skipped — see docs/versioning.md §4.
schema_version = 1

## Nine configuration.
##
## This is the only config file: the same nine.toml serves the native and the
## container layouts. It is written for a native run against a local Ollama and
## works as-is after `make all` — there is no database to provision.
##
## The container (adr/single-container.md) overrides what differs via
## environment variables (see the Makefile's `up`/`up-hot` targets) rather than
## a second config file:
##   NINE_LLM_ENDPOINT     http://host.docker.internal:11434
##   NINE_PLUGINS_BIN      /opt/nine/bin
##   NINE_WORKSPACE_ROOT   /data/workspace
## The database needs no override there: it defaults to /data/nine.db whenever
## the /data volume is present.
##
## Search order: $NINE_CONFIG, ./nine.toml, /nine.toml, ~/.nine/nine.toml.
## Full reference: docs/configuration.md

[llm]
# Chat provider: "ollama" (the default) or "mistral". Ollama is what Nine is
# developed against and is what keeps a deployment local; mistral is a hosted
# API. Any other value is refused at startup rather than quietly served by a
# different backend.
provider       = "ollama"
model          = "qwen3.5:4b"
# Empty uses Ollama's local default (http://localhost:11434), or Mistral's
# (https://api.mistral.ai/v1). Overridden in the container with
# NINE_LLM_ENDPOINT.
endpoint       = ""
# Bearer token for a hosted provider. Ollama ignores it; mistral needs it.
# Prefer NINE_LLM_API_KEY over writing a secret into this file.
# api_key      = ""
# HTTP timeout for a single model call. 0 uses the adapter default (300s);
# a negative value removes the timeout, leaving only turn cancellation.
# timeout_seconds = 0
# Most tokens one reply may generate; unset keeps 2048. Raise it for a model
# that writes long code or documents. NINE_LLM_MAX_TOKENS overrides it.
# max_tokens = 2048
# Keep at 1 for local models to prevent contention.
max_concurrent = 1
# Requested context window; also sets the per-turn context budget.
num_ctx        = 32768
# context_budget defaults to num_ctx (32768) when not set
# thinking: stream the model's reasoning as a live trace in the TUI (Ollama only;
# the model must advertise the "thinking" capability). Defaults to true; set to
# false to suppress thinking (restores /no_think) for lower latency.
# thinking = true

[daemon]
socket_path = "/tmp/nine.sock"
task_timeout_seconds = 1800  # 30 minutes
# Display name for this Nine instance, shown in the TUI top bar. Set it here to
# pin a fixed name. Left unset, the daemon reuses a name it generated on a prior
# boot, or — on a first boot with none — shows "nine" and asks the LLM to coin a
# random name, then persists it so it stays stable thereafter.
# instance_name = "atlas"
# When true, the [[agent]] list below is the full desired state: a config-origin
# goal no longer listed here is archived and its session stopped on boot
# (adr/predefined-agents-design.md §7 v3). Conversation-created goals are never
# touched. Default false — removing an entry just stops reconciling it.
# standing_agents_authoritative = false
# Links topically-similar sessions out-of-band and lets a later turn pull a
# related prior session into context (adr/reactive-events.md). On by default;
# requires an embedder (a no-op when [embeddings] is disabled). Uncomment to
# disable.
# related_sessions_index = false

[plugins]
# The directory holding plugins that ship as their own binaries. The Go
# built-ins (shell/files/http/time) are not among them: they live inside the
# nine binary and are started as `nine plugin serve <name>`. Nine ships nothing
# into `bin` any more, so it matters only if one of your own plugins puts its
# binary there (./dist/bin; the image resolves /opt/nine/bin via
# NINE_PLUGINS_BIN). Your own plugins go in `user_dir` below.
bin = "./dist/bin"
# Plugins that must never start, by name — the lever for withholding a
# capability. `shell` executes arbitrary commands, so this is the way to run
# without it. Applies to built-ins, MCP servers (as `mcp:<name>`), and your own
# plugins alike; a disabled plugin shows as `off` in `nine plugins` rather than
# silently missing.
# The container can override this with NINE_PLUGINS_DISABLED="shell,mcp:github".
# disabled = ["shell"]
# Your own plugins, discovered at boot from a sidecar-manifest layout (see
# plugins.d/README.md and docs/plugins.md):
#
#   plugins.d/weather        the plugin executable
#   plugins.d/weather.toml   its manifest (name + entrypoint)
#
# A binary with no manifest is never executed. A plugin that fails the handshake,
# or whose tools collide with an already-loaded plugin, is skipped and surfaced —
# the daemon still starts. Check first with `nine plugin validate`; inspect the
# live roster with `nine plugins`; re-scan without a restart via
# `nine plugins reload`. Unset or missing disables user plugins. The container
# overrides this with NINE_PLUGINS_USER_DIR.
# user_dir = "./plugins.d"

# ── MCP servers ───────────────────────────────────────────────────────────────
# Each [[mcp.server]] becomes one plugin: Nine starts an `mcp` bridge process
# per server, so an MCP server behaves like any other plugin — it crashes on its
# own, shows up in `nine plugins` as `mcp:<name>`, and is switched off with
# `[plugins] disabled = ["mcp:github"]`.
#
# Its tools are prefixed with the server name, so two servers that both expose
# `search` cannot collide: github__create_issue, filesystem__read_file.
#
# [[mcp.server]]
# name    = "github"
# command = "npx"
# args    = ["-y", "@modelcontextprotocol/server-github"]
# [mcp.server.env]
# GITHUB_PERSONAL_ACCESS_TOKEN = "ghp_..."
#
# A hosted server is reached by url instead of being spawned (MCP streamable
# HTTP). Use headers for auth; env applies only to a spawned command.
# [[mcp.server]]
# name = "hosted"
# url  = "https://mcp.example.com/rpc"
# [mcp.server.headers]
# Authorization = "Bearer ..."

[memory]
# SQLite database file holding all durable state. Created on first run, along
# with its parent directory. Defaults to /data/nine.db when the container's
# /data volume is present, else ~/.nine/nine.db. Override with NINE_DB_PATH.
# path = "~/.nine/nine.db"
# Index each memory_set into a shared vector pool and pull-surface the memories
# most relevant to the current turn as advisory context. On by default; needs an
# embedder (no-op when embeddings are disabled). Set false to turn it off.
# surface_memories = false

[embeddings]
# provider = "ollama" requires nomic-embed-text to be pulled and uses extra VRAM.
# Leave empty to use the built-in keyword embedder (feature hashing, no model needed).
# Set to "none" to disable tool ranking entirely.
provider = ""
model    = "nomic-embed-text"
# Only used when provider = "ollama"; empty uses Ollama's local default.
endpoint = ""
api_key  = ""

[ui]
theme = "dark"  # "auto" detects terminal background; "light" or "dark" to force

[workspace]
# The one directory Nine writes agent files into: the sandboxed file tools are
# mounted here and `shell` runs here. The container overrides it to the mounted
# volume at /data/workspace (NINE_WORKSPACE_ROOT).
root = "./dist"

# Deleted and overwritten files are moved to .nine/trash/ inside the workspace,
# not destroyed, so a mistake in an unsupervised session can be undone
# (trash_list, restore_file). The trash sits on your disk, so it is bounded by
# both age and size; the sweep runs hourly, oldest entry first.
# trash_retention_days = 7        # -1 disables the age bound, leaving size alone
# trash_max_bytes      = 1073741824

# Files here are full-text searchable, including ones Nine never wrote: a bind
# mount that arrived full, a git pull, a file you dropped in. A background scan
# keeps the index in step with the directory, and a search refreshes the subtree
# it is about to look at.
# scan_interval_seconds = 60
# index_max_file_bytes  = 8388608     # larger files still list, and are searched when named
# index_max_files       = 50000       # a scan stopping here says so in search results

[skills]
# Your own skills and roles, seeded alongside the built-ins on every boot
# (docs/skills.md). Layout mirrors the built-ins:
#
#   skills.d/my-skill.md          a knowledge skill
#   skills.d/roles/my-role.md     a role (a skill with a `role:` block)
#
# The directory is the source of truth: edit a file and restart to update it,
# delete the file to remove it. Discovery is boot-only — there is no watcher.
# Invalid files are skipped with a logged reason; the daemon still starts.
# Check them first with `nine skills validate`.
#
# Names must not collide with a built-in (built-ins win). Unset or missing
# disables user skills. The container overrides this with NINE_SKILLS_USER_DIR.
# user_dir = "./skills.d"

# Sandboxed tools (spec/contracts/toolvm.md): JavaScript or .wasm tools you drop
# in a directory, run in a wasm sandbox with only the capabilities granted below.
# A second backend behind the same dispatcher as plugins — not a replacement.
#
#   tools.d/csvstats.toml    the manifest (the gate)
#   tools.d/csvstats.js      the code
#
# tools.d/ ships EMPTY: anything in it becomes a tool the model can call, so it
# holds what you put there. Two worked JavaScript examples are in examples/tools/
# (copy one in). JS is the supported language; a .wasm module from another
# language runs on a specified but unsupported contract (`nine spec toolvm`).
#
# ON by default: this tier carries the workspace file tools (read_file,
# write_file, edit_file and the rest), so a deployment without it cannot touch a
# file. Set `enabled = false` to decline it. See tools.d/README.md for a working
# example, and `nine tools` for the roster (including anything that failed to
# load, and why). The container overrides the directory with
# NINE_TOOLS_USER_DIR; `enabled` is not environment-overridable in either
# direction.
# [tools]
# enabled   = true     # the default; false turns the host off entirely
# user_dir  = "./tools.d"
# timeout   = "5s"     # per-call wall clock; override for one tool with
#                      # [tool.<name>] timeout below
# max_ops   = 50000000 # per-call work budget for a `js` tool, in operations —
#                      # what a call DOES, where timeout is how long it takes.
#                      # Uncatchable, so a tool cannot try/catch past it. A
#                      # `wasm` tool is not metered: no interpreter to interrupt.
# memory_mb = 16
# max_concurrent = 8   # how many calls run at once; memory_mb is per call, so
#                      # the two multiply into the host's worst-case memory

# Capability grants, per named tool. A tool's manifest DECLARES what it needs;
# only this GRANTS. The two must name the same capabilities or the tool fails to
# load with a named error. Default for everything with reach is nothing; clock,
# randomness, and logging are always on. There is no wildcard [tool."*"].
# [tool.csv_stats.capabilities.fs]
# read = [{ host = "/srv/data", guest = "/data" }]   # host path must be absolute

# A per-tool wall-clock deadline, overriding [tools] timeout for this tool only.
# A resource bound rather than a capability, so it sits outside [capabilities].
# Raising it lets one genuinely slow tool have the time without handing the same
# budget to a tool with an infinite loop; lowering it pins a risky one down.
# [tool.slow_report]
# timeout = "30s"

# Outbound HTTP. The hostname must match allow_hosts AND the address actually
# dialed must be publicly routable — loopback, link-local (169.254.169.254, where
# your cloud keeps its instance credentials), and RFC1918 are refused no matter
# what a name resolves to, on every redirect hop. No bare "*": if you want
# unrestricted egress, write a native plugin.
# [tool.weather.capabilities.net.http]
# allow_hosts = ["api.weather.example"]   # exact, or a leading "*." (not the apex)
# methods     = ["GET"]                   # required
# max_bytes   = 1048576                   # response cap; 0 uses 1 MiB

# Generated tools: the tier Nine writes itself (docs/sandboxed-tools.md, R-TVM.14/15).
# ON by default, and gated by [tools] enabled above it — the tier runs on the
# host, so turning the host off turns this off with it. The ceiling is the MAXIMUM
# a generated tool may be granted, never an automatic grant: a tool that declares
# nothing gets nothing, however wide the ceiling is. Generated tools may always
# import the nine:* stdlib (nine:csv, nine:date, nine:diff); external npm packages
# are a separate, riskier switch, resolved and bundled at write time and OFF by
# default.
#
# The default ceiling is the workspace, read and write, derived from
# [workspace].root at boot — the same directory and the same /work guest path the
# shipped file tools use. Grant any fs mount below and you replace that default
# rather than adding to it. Note there is no variable expansion in this file: a
# host path is a literal absolute path, which is exactly why the default is
# derived in code instead of written here.
# [tools.agent]
# enabled          = true             # the default; false keeps the host without the tier
# eval             = true             # allow js_eval (run a snippet, persist nothing)
# max_tools        = 64               # catalog cap; least-recently-used are evicted
# require_approval = "on_capability"  # on_capability (default) | always | never
# [tools.agent.capabilities.fs]
# read  = [{ host = "/srv/data", guest = "/data" }]   # absolute; replaces the workspace default
# write = [{ host = "/srv/out",  guest = "/out" }]
# [tools.agent.deps]
# mode  = "allowlist"                 # off (default) | allowlist | open ; frozen = true to pin
# allow = [{ name = "date-fns", version = "^4.1.0" }]
# allow_network_deps is set on [tools.agent], not here, and lifting it is dangerous:
# a networked dependency turns the sandbox into an exfiltration path.

# Human-in-the-loop (docs/hitl.md), interactive TUI conversations only.
# require_approval names tools that need an explicit "yes" before each call;
# gate_sub_agents (default true) extends those gates to sub-agents the
# conversation spawns, so delegation is not a way around them — the prompt
# arrives on your stream, attributed to the sub-agent.
[hitl]
# timeout_seconds  = 300
require_approval = ["shell", "write_file"]
# gate_sub_agents  = true

[planning]
# Plan-before-execute policy (adr/thinking-and-planning.md). Both keys have a
# live per-session override via the /plan-mode command.
# plan_mode — how the agent reasons before acting:
#   off        no native thinking and no analysis pass
#   plan-only  (default) reason on the first inner call, then execute
#   always     request native thinking on every inner call
# plan_mode = "plan-only"
# plan_approval — interactive plan-approval checkpoint before a plan executes:
#   off        never prompt
#   on         always prompt
#   on-risky   (default) prompt only when the plan intends a [hitl].require_approval tool
plan_approval = "on-risky"

# Pre-defined, long-running agents (docs/predefined-agents.md). Each [[agent]]
# is seeded as a config-owned goal at boot and runs under the pursue shell with
# a narrowed role — no human turn needed to bring it to life. `id` is a stable,
# operator-chosen key; edit `description`/`role`/trigger and restart to
# reconcile in place. `role` defaults to "monitor" (read-only). Set a wake
# trigger with `interval` (Go duration) XOR `schedule` (5-field cron; see
# docs/scheduling.md). Findings reach you via `nine notifications`.
#
# [[agent]]
# id          = "sec-watch"
# description = "Monitor this repo for security issues; triage new CVEs affecting our deps."
# role        = "monitor"
# schedule    = "0 9 * * 1-5"   # weekdays at 09:00  (or e.g. interval = "24h")

# This development config takes the defaults for both tool tiers: the sandboxed
# host runs, and the generated tier with it, with the workspace as the ceiling.
# The reference block above documents every key. Nothing is set here because
# nothing needs overriding — `enabled` defaults to true on both.
