id: process-budget-pause
description: "A process that spends its budget is paused and the pause reaches the human feed: a pursue process allowed two turns a day takes two ticks, and its third is refused with E_BUDGET. Every model passes it or nine is broken — what is measured is the runtime, not the model. (pursue drives the ticks because a reflect process skips a clock tick with nothing new to digest, and nothing here ever happens.)"
track: live
tier: basic
tags: [processes, budgets]

setup:
  processes:
    # A goal binds it, so every clock tick runs a turn; the goal never
    # completes, so nothing the process's model does stops it before its
    # budget does. Goal-bound processes are named goal:<name>.
    - name: time-log
      tool: pursue
      goal: "Keep a running log of the time of day in notes/timelog.md, one line per tick. This goal never completes; leave it active."
      role: pursue
      every: 2s
      budget: { turns_per_day: 2 }

wait:
  seconds: 300
  session: time-log
  until:
    notifications: { contains: "spent its budget" }

expect:
  side_effects:
    notifications: { contains: "Process goal:time-log spent its budget for the day (2 of 2 turns" }
    processes:
      goal:time-log: { state: stopped, stopped_by: budget }

runs: 3
pass_threshold: "3/3"
timeout_seconds: 360
models:
  expected_pass_min_class: nano
