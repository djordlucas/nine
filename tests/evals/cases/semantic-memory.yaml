id: semantic-memory
description: "Store several facts as embeddings, then answer a paraphrased question only a by-meaning search can resolve — exercising the memory_embed/memory_query path, not key-value recall."
track: live
tier: multi_step
tags: [memory, vectors, semantic]

prompts:
  - "I'll ask you to recall these later by meaning rather than exact wording, so store each fact in your semantic memory under the namespace 'memories': (a) The staging cluster lives in eu-central-1. (b) Production traffic is served from us-east-1. (c) The analytics warehouse sits in ap-southeast-2."
  - "Using a semantic search over that memory, which region would our pre-production environment run in?"

expect:
  side_effects:
    vectors: { namespace: memories, min: 1 }
  trajectory:
    tools_any_of: [memory_embed, memory_query]
    no_stall: true
  answer:
    contains: ["eu-central-1"]
    not_contains: ["us-east-1", "ap-southeast-2"]

runs: 3
pass_threshold: "2/3"
models:
  expected_pass_min_class: medium
