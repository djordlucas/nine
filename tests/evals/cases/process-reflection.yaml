id: process-reflection
description: "After another session's turn, the reflect process hands its session a digest of the journal with no prompt of its own, and the model updates its self-model (self/learned) with memory_set."
track: live
tier: basic
tags: [processes, reflection]

setup:
  processes:
    - name: introspect
      tool: reflect
      role: reflection
      every: 2s

# A reflection with nothing new to read is skipped, so a conversation turn
# gives it something.
prompts:
  - "Remember that my favourite colour is teal."

wait:
  seconds: 180
  session: introspect
  until:
    kv:
      self/learned: { matches: "\\S" }

expect:
  side_effects:
    kv:
      self/learned: { matches: "\\S" }

runs: 3
pass_threshold: "2/3"
timeout_seconds: 240
models:
  expected_pass_min_class: small
