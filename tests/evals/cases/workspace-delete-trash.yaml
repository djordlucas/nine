id: workspace-delete-trash
description: "Delete a workspace file and confirm it is gone. Guards delete_file and the trash: the file leaves the workspace, and a later listing does not report it."
track: live
tier: multi_step
tags: [files, workspace, delete]


setup:
  files:
    /work/notes/keep.md: "Quarterly plan: hire two engineers in Q3.\n"
    /work/notes/obsolete-draft.md: "Superseded draft. Codeword tangerine-77.\n"

prompts:
  - "Delete /work/notes/obsolete-draft.md — it is superseded."
  - "List the files under /work/notes and tell me exactly which ones are there now."

expect:
  side_effects:
    files:
      # The strong evidence, and the one a model cannot talk its way past.
      /work/notes/obsolete-draft.md: { absent: true }
      /work/notes/keep.md: { contains: "Quarterly plan" }
  trajectory:
    tools_all_of: [delete_file]
    tools_any_of: [list_files]
    max_turns: 3
    no_stall: true
  answer:
    # Only that the survivor is named. An earlier version also asserted the
    # deleted name was absent from the answer, which failed every run against a
    # correct one: asked what is in the directory now, a model reasonably says
    # "obsolete-draft.md is gone". Naming a file is not failing to delete it.
    contains: ["keep.md"]

runs: 3
pass_threshold: "2/3"
models:
  # Measured, not guessed: 3/3 twice on qwen3.5:9b (small).
  expected_pass_min_class: small
