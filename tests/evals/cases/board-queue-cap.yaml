id: board-queue-cap
description: "The [board] max_queued admission guard: with max_queued = 1, a second open post from the same session is refused with the reason, and the first task still completes. What is measured is the runtime, not the model."
track: live
tier: basic
tags: [board, limits]

session:
  role: orchestrator
  config:
    board.max_queued: 1

prompts:
  - "Post a board task titled 'first' with spec 'anything'. Then post a second task titled 'second' with spec 'anything' and report exactly what the second post returned."

expect:
  trajectory:
    tools_all_of: [board_post]
  # Two posts were attempted; exactly one task may be on the board — the
  # second was refused at the cap (the refusal text is in the trajectory).
  side_effects:
    board:
      tasks: 1

runs: 3
pass_threshold: "2/3"
timeout_seconds: 180
models:
  expected_pass_min_class: nano
