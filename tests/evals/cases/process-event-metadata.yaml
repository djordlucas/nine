id: process-event-metadata
description: "An event trigger delivers metadata by default: a process on tool_end, filtered to write_file in conversations, logs each event it receives, and the log names the tool but not what was written. It measures the runtime, so every model must pass it."
track: live
tier: basic
tags: [processes, events, generated]

session:
  config:
    tools.agent.enabled: true
    tools.agent.allow_processes: true

setup:
  generated_tools:
    write_watch:
      description: "Logs every write_file a conversation makes."
      capabilities: '{"fs":["read","write"]}'
      source: |
        import { next } from "nine:process";
        import { appendFile } from "nine:fs";
        export default () => {
          for (;;) {
            const t = next();
            if (t.kind === "event") appendFile("/work/notes/events.log", JSON.stringify(t.event.data) + "\n");
          }
        };
      process:
        on: [tool_end]
        on_filter: { tool: write_file, sessions: conversations }
        event_content: false

prompts:
  - "Write the text CONTENT-MARK-71 to the file notes/a.txt."

wait:
  seconds: 120
  until:
    files:
      notes/events.log: { contains: "write_file" }

expect:
  side_effects:
    files:
      notes/events.log: { contains: "write_file", not_contains: "CONTENT-MARK-71" }

runs: 3
pass_threshold: "3/3"
models:
  expected_pass_min_class: nano
