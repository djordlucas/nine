id: process-condition-trigger
description: "A slice process on a fast clock pipes its output to an agent's session (report_to), and the agent acts on it: the finding arrives as the agent's turn, with no prompt and no clock of its own. The slice tool is an MCP server's, prefixed with the server name \u2014 the only way a process gets a tool that is not built in (adr/modular_nine.md \u00a79.10)."
track: live
tier: multi_step
tags: [processes, pipes, mcp]

setup:
  mcp_servers:
    - name: fixture
      command: "${NINE_EVAL_MCP_FIXTURE}"
  processes:
    - name: oncall
      tool: pursue
      goal: "Handle deploy incidents reported to you: record each one in notes/incident.md in the workspace."
      role: pursue
      every: 1h
    - name: deploy-watch
      tool: fixture__mcp_echo
      every: 2s
      report_to: oncall
      args:
        message: "Deploy 42 failed with error code DEPLOY-FAILED-42. Record this incident, with its error code, in notes/incident.md."

wait:
  seconds: 240
  session: oncall
  until:
    files:
      notes/incident.md: { contains: "DEPLOY-FAILED-42" }

expect:
  side_effects:
    files:
      notes/incident.md: { contains: "DEPLOY-FAILED-42" }

runs: 3
pass_threshold: "2/3"
timeout_seconds: 300
models:
  expected_pass_min_class: medium
