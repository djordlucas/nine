id: file-store-search
description: "Stash content in the file store across turns, then locate it by full-text search (file_store then file_search_text)."
track: live
tier: multi_step
tags: [files, search]

prompts:
  - "Store two files for later. Path runbooks/db-restore.md with content 'To restore prod: pg_restore from the nightly snapshot in s3://backups/pg.' and path runbooks/cache-flush.md with content 'To flush the cache: redis-cli FLUSHALL on the edge node.'"
  - "Search your stored files for the one about restoring the database and tell me exactly where the snapshot lives."

expect:
  trajectory:
    tools_all_of: [file_store]
    tools_any_of: [file_search_text, file_fetch, file_list]
    max_turns: 2
    no_stall: true
  answer:
    contains: ["s3://backups/pg"]

runs: 3
pass_threshold: "2/3"
models:
  expected_pass_min_class: medium
