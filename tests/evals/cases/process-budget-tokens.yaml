id: process-budget-tokens
description: "Tokens bound a process as turns do: a pursue process allowed 3000 tokens a day spends more than that in its first turn, its second is refused, and it is paused with the feed told. It measures the runtime with real token counts, so every model must pass it. (pursue drives the ticks because a reflect process skips a clock tick with nothing new to digest, and nothing here ever happens.)"
track: live
tier: basic
tags: [processes, budgets]

setup:
  processes:
    # A goal binds it, so every clock tick runs a turn; the goal never
    # completes, so nothing the process's model does stops it before its
    # budget does. Goal-bound processes are named goal:<name>.
    - name: introspect
      tool: pursue
      goal: "Watch the workspace and note the time of day in notes/introspect.md, one line per tick. This goal never completes; leave it active."
      role: pursue
      every: 2s
      budget: { tokens_per_day: 3000 }

wait:
  seconds: 240
  session: introspect
  until:
    notifications: { contains: "spent its budget" }

expect:
  side_effects:
    notifications: { contains: "(1 of 200 turns" }
    processes:
      goal:introspect: { state: stopped, stopped_by: budget }

runs: 3
pass_threshold: "3/3"
timeout_seconds: 300
models:
  expected_pass_min_class: nano
